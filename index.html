<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymBeam+ – návrh dizajnu v2 (web, mobile web, app)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{
  --web:#F2541B;       /* web accent podľa screenshotov */
  --app:#FF4410;       /* app brand */
  --app2:#FF6840; --appA:#FFA633; --appS:#FFD5CA;
  --ink:#000; --tx:#111; --mut:#6B7280; --line:#E3E5E8; --soft:#F3F4F6;
  --green:#6DB33F; --greenBg:#EEF7E8; --red:#D92D20; --redBg:#FDECEA; --amberBg:#FFF4E5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#D9DCE1;color:var(--tx);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:inherit}
.i{display:inline-block;vertical-align:middle;flex:none}
:focus-visible{outline:2px solid #2563EB;outline-offset:2px}

/* ============ TOOLBAR ============ */
.tb{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.tb-brand{font-weight:800;font-style:italic;letter-spacing:-.03em;font-size:18px;margin-right:6px}
.tb-brand b{color:var(--web)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#374151}
.seg button.on{background:#000;color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{border:1px solid var(--line);background:#fff;padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:500}
.pills button.on{border-color:#000;background:#000;color:#fff}
.tb-state{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);margin-left:auto}
.tb-state select{font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line)}
.tb-reset{border:0;background:none;font-size:12.5px;color:var(--mut);text-decoration:underline}

/* ============ STAGE ============ */
.stage{display:flex;flex-wrap:wrap;gap:24px;padding:24px;align-items:flex-start;justify-content:center}
.notes{width:340px;max-width:100%;background:#fff;border-radius:14px;padding:18px 18px 8px;font-size:13px;line-height:1.5;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.notes h4{margin:0 0 8px;font-size:14px}
.notes h5{margin:14px 0 6px;font-size:12.5px;color:#374151}
.notes ul{margin:0 0 10px;padding-left:18px}
.notes li{margin:3px 0}
.notes .tag{display:inline-block;background:var(--amberBg);color:#8A4B00;border-radius:6px;padding:1px 6px;font-size:11.5px;font-weight:600}
.ig{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 12px}
.ig button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;font-weight:600}
.ig button.on{border-color:#000;box-shadow:inset 0 0 0 1px #000}

/* ============ FRAMES ============ */
.browser{width:min(1200px,100%);background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.browser-bar{height:40px;background:#EDEEF0;display:flex;align-items:center;gap:8px;padding:0 14px}
.browser-bar i{width:11px;height:11px;border-radius:50%;background:#C9CCD1}
.browser-bar span{margin-left:14px;background:#fff;border-radius:7px;padding:4px 12px;font-size:12px;color:#555;flex:1;max-width:520px}
.vp-wrap{position:relative;overflow:hidden}
.viewport{height:820px;overflow:auto;position:relative;background:#fff}
.phone{width:390px;height:844px;border-radius:52px;background:#000;padding:10px;box-shadow:0 24px 60px rgba(0,0,0,.28);flex:none}
.phone .vp-wrap{height:100%;border-radius:42px;background:#fff}
.phone .viewport{height:100%}
.sbar{height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font-weight:600;font-size:15px;flex:none}
.sbar .dots{display:flex;gap:5px;align-items:center}
.sbar .dots i{display:block;width:17px;height:10px;border:1.5px solid currentColor;border-radius:3px}
.urlbar{margin:0 14px 6px;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:12.5px;color:#555;text-align:center}
.mweb-wrap{display:flex;flex-direction:column;height:100%}
.mweb-wrap .viewport{flex:1;height:auto}
.toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;z-index:40;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.phone .toast{bottom:112px;white-space:normal;width:86%;text-align:center}

/* ============ SHARED BRAND ============ */
.wm{font-weight:900;font-style:italic;letter-spacing:-.045em;line-height:1;white-space:nowrap}
.wm b{color:var(--app);font-style:normal;margin-left:1px;position:relative;top:-.28em;font-size:.72em}
.wm.light{color:#fff}
.aicon{position:relative;display:inline-block;border-radius:22.5%;overflow:hidden;flex:none}
.aicon svg{position:absolute;inset:6%;width:88%;height:88%}
.aicon b{position:absolute;top:3%;right:9%;font-weight:900;line-height:1;font-family:Inter,Arial,sans-serif}

.mcard{position:relative;aspect-ratio:1.586;width:100%;max-width:360px;border-radius:18px;background:#000;color:#fff;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;isolation:isolate}
.mcard::before{content:"";position:absolute;right:-30%;top:-60%;width:90%;height:150%;background:radial-gradient(closest-side,rgba(255,68,16,.55),rgba(255,68,16,0));z-index:-1}
.mc-lines{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.mc-top{display:flex;justify-content:space-between;align-items:center}
.mc-top .wm{font-size:24px}
.mc-chip{font-size:11px;font-weight:600;background:rgba(255,255,255,.14);padding:4px 9px;border-radius:999px}
.mc-name{font-size:17px;font-weight:600;letter-spacing:.01em}
.mc-bot{display:flex;gap:28px;font-size:14px;font-weight:600}
.mc-bot small{display:block;font-size:10.5px;font-weight:500;opacity:.6;margin-bottom:2px}
.mcard.off{background:var(--soft);color:#9CA3AF;border:1.5px dashed #C8CCD2}
.mcard.off::before{display:none}
.mcard.off .wm{color:#9CA3AF}.mcard.off .wm b{color:#C3C7CD}
.mcard.off .mc-mid{font-size:14px;font-weight:500;color:#6B7280}
.mcard.paused{filter:grayscale(1);opacity:.75}

/* ============ WEB ============ */
.web{container:web/inline-size;font-size:14px;color:#111;min-height:100%;position:relative}
.wh{padding:0 28px}
.wh-top{display:flex;align-items:center;gap:24px;height:72px}
.logo{font-weight:900;font-style:italic;font-size:32px;letter-spacing:-.05em;line-height:1}
.logo sup{font-size:9px;font-style:normal;font-weight:500;vertical-align:top}
.search{flex:1;max-width:460px;margin:0 auto;border:1.5px solid #D4D6DA;border-radius:999px;height:42px;display:flex;align-items:center;gap:10px;padding:0 16px;color:#8A8F98}
.wh-user{display:flex;align-items:center;gap:16px}
.wh-user .uname{color:var(--web);font-size:14px}
.burger{display:none;border:0;background:none;padding:0}
.wh-nav{display:flex;gap:30px;font-weight:700;font-size:17px;padding:8px 0 14px}
.wh-msearch{display:none}
.acc{display:grid;grid-template-columns:240px 1fr;gap:40px;padding:6px 28px 40px}
.acc-side{display:flex;flex-direction:column;gap:14px;font-size:14px;padding-top:4px}
.acc-side a{text-decoration:none;display:flex;align-items:center;gap:8px}
.acc-side a.on{color:var(--web);font-weight:600}
.new{background:#000;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px}
.acc-back{display:none;font-size:13px;color:var(--mut);margin-bottom:6px}
.acc-title{color:var(--web);font-size:21px;font-weight:600;margin:0 0 16px}
.barh{background:var(--soft);padding:14px 16px;font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-top:28px}
.box{border:1.5px solid var(--line);border-top:0;padding:18px}
.btn-pri{background:var(--web);color:#fff;border:0;height:46px;padding:0 26px;font-weight:700;font-size:14px;letter-spacing:.02em;border-radius:3px}
.btn-dark{background:#000;color:#fff;border:0;height:40px;padding:0 18px;font-weight:700;font-size:13px;border-radius:3px;white-space:nowrap}
.btn-out{background:#fff;color:#000;border:1.5px solid #000;height:40px;padding:0 18px;font-weight:700;font-size:13px;border-radius:3px;white-space:nowrap}
.btn-green{background:#8BC34A;color:#fff;border:0;height:50px;width:100%;font-weight:700;letter-spacing:.03em;border-radius:3px}
.lnk{color:var(--web);text-decoration:underline;background:none;border:0;padding:0;font-size:inherit}

.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;border:1.5px solid var(--line);padding:32px}
.hero .wm{font-size:30px}
.hero h2{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:14px 0 10px;max-width:18ch}
.hero p{margin:0 0 18px;color:#374151;font-size:15px;max-width:44ch}
.price{display:flex;align-items:baseline;gap:6px}
.price strong{font-size:34px;font-weight:800;letter-spacing:-.02em}
.price span{color:var(--mut);font-size:15px}
.hero small{display:block;color:var(--mut);font-size:12.5px;margin:4px 0 20px;max-width:46ch}
.hero .row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero-card{display:flex;justify-content:center}
.hero-card .mcard{transform:rotate(-4deg)}
.calc{display:flex;gap:14px;align-items:flex-start;background:var(--greenBg);padding:16px 18px;margin-top:16px;border-radius:4px}
.calc b{display:block;font-weight:600;margin-bottom:2px}
.calc span{color:#374151}
.calc .i{color:#3F7D1F;margin-top:1px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:s}
.steps li{padding:18px 16px 18px 0;counter-increment:s;position:relative}
.steps li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#000;color:#fff;font-weight:700;font-size:13px;margin-bottom:10px}
.steps b{display:block;margin-bottom:4px}
.steps span{color:#4B5563;font-size:13.5px}
.cov{width:100%;border-collapse:collapse}
.cov td{padding:11px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.cov tr:last-child td{border-bottom:0}
.cov td:last-child{text-align:right;font-weight:600;white-space:nowrap}
.yes{color:#3F7D1F}.no{color:#9CA3AF;font-weight:500!important}
.cov .dot{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;margin-right:10px;vertical-align:middle}
.cov .dot.y{background:var(--greenBg);color:#3F7D1F}.cov .dot.n{background:var(--soft);color:#9CA3AF}
.faq{border-bottom:1px solid var(--line)}
.faq:last-child{border-bottom:0}
.faq button{width:100%;border:0;background:none;text-align:left;padding:14px 0;display:flex;justify-content:space-between;gap:16px;font-weight:600;font-size:14.5px;color:#111}
.faq button .i{transition:transform .2s}
.faq.open button .i{transform:rotate(90deg)}
.faq p{margin:0 0 14px;color:#4B5563;max-width:70ch;line-height:1.55}
.terms-foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.member{display:grid;grid-template-columns:360px 1fr;gap:28px;align-items:stretch}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{border:1.5px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:4px}
.stat span{font-size:12.5px;color:var(--mut)}
.stat strong{font-size:28px;font-weight:800;letter-spacing:-.02em}
.stat small{font-size:12px;color:var(--mut)}
.stat.wide{grid-column:1/-1}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--appA),var(--app));border-radius:99px}
.dl{display:grid;grid-template-columns:180px 1fr;gap:10px 16px;margin:0}
.dl dt{color:var(--mut)}
.dl dd{margin:0;font-weight:500}
.st-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px dashed #D1D5DB}
.notice{display:flex;gap:12px;padding:14px 16px;border-radius:4px;margin-bottom:16px;align-items:flex-start}
.notice b{display:block;margin-bottom:2px}
.notice.red{background:var(--redBg);color:#7A1A12}
.notice.amber{background:var(--amberBg);color:#6B3B00}
.notice.green{background:var(--greenBg);color:#2F5E17}
.hist{width:100%;border-collapse:collapse;font-size:13.5px}
.hist th{text-align:left;font-weight:600;padding:0 0 10px;color:#374151}
.hist td{padding:11px 0;border-top:1px solid var(--line)}
.hist td:nth-child(3),.hist th:nth-child(3){text-align:right}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px}
.pill.ok{background:var(--greenBg);color:#3F7D1F}.pill.bad{background:var(--redBg);color:var(--red)}
.wfoot{background:#000;color:#9CA3AF;font-size:12px;padding:22px 28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* checkout web */
.co-head{display:flex;align-items:center;justify-content:space-between;padding:14px 28px 6px}
.co-steps{display:flex;align-items:center;gap:12px;justify-content:center;padding:6px 0 18px;font-weight:600;font-size:17px}
.co-steps .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:13px;margin-right:8px}
.co-steps .done{background:#000;color:#fff}.co-steps .cur{background:var(--web);color:#fff}.co-steps .nx{background:var(--soft);color:#9CA3AF}
.co-steps .ln{width:80px;height:1.5px;background:#555}
.co-steps .muted{color:#9CA3AF}
.co{display:grid;grid-template-columns:1fr 380px;gap:32px;padding:10px 28px 40px}
.co h2{font-size:19px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:baseline}
.co h2 small{font-size:13px;color:var(--mut);font-weight:400}
.cbox{border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px}
.cbox h3{font-size:16px;margin:0 0 12px}
.addr{border:1.5px solid var(--web);border-radius:6px;padding:12px 14px;line-height:1.7;width:320px;max-width:100%;font-size:13.5px}
.grp{background:var(--soft);padding:10px 16px;font-weight:600;border:1px solid var(--line);border-bottom:0}
.opts{border:1px solid var(--line)}
.opt{display:grid;grid-template-columns:28px 52px 1fr 110px 120px 24px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;background:#fff}
.opt:first-child{border-top:0}
.opt .rad{width:22px;height:22px;border-radius:50%;border:1.5px solid #333}
.opt.sel .rad{border:7px solid var(--web)}
.opt .lg{height:34px;border-radius:5px;display:grid;place-items:center;font-size:9px;font-weight:800;color:#fff}
.opt .pr{font-weight:500;color:var(--web)}
.opt .pr.free{color:var(--green)}
.opt .pr s{color:#9CA3AF;font-weight:400;margin-right:6px}
.opt .dt{text-align:right;font-size:13px}
.opt .hint{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.opt .hint a{color:var(--web)}
.gbchip{display:inline-flex;align-items:center;gap:4px;background:#000;color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;margin-left:8px;vertical-align:1px}
.gbchip b{color:var(--app2)}
.gbb{display:flex;align-items:center;gap:14px;border:1.5px solid #000;border-radius:6px;padding:12px 14px;margin-bottom:12px;background:#fff;position:relative}
.gbb-txt{flex:1;font-size:13.5px;line-height:1.45;padding-right:18px}
.gbb-txt b{display:block;font-size:14px}
.gbb-txt span{color:#4B5563}
.gbb-txt a{color:#000;font-weight:600;cursor:pointer;margin-left:4px}
.gbb .x{position:absolute;top:6px;right:6px;border:0;background:none;padding:4px;color:#6B7280}
.gbb.in{border-color:var(--green);background:var(--greenBg)}
.gbb.in .i{color:#3F7D1F}
.sum h3{font-size:18px;margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sum .r{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:#4B5563}
.sum .r b{color:#111;font-weight:600}
.sum .tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 2px;font-size:18px;font-weight:700}
.sum .tot span:last-child{color:var(--web);font-size:21px}
.sum .vat{text-align:right;font-size:12px;color:var(--mut);margin-bottom:14px}
.sum .gbl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px}
.sum .note{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.45}

/* drawer / modal web */
.ovl{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;justify-content:flex-end}
.ovl.center{justify-content:center;align-items:center}
.drawer{width:480px;max-width:100%;height:100%;background:#fff;display:flex;flex-direction:column;animation:slin .25s ease-out}
@keyframes slin{from{transform:translateX(30px);opacity:.3}}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);font-size:18px;font-weight:700}
.drawer-h button{border:0;background:none;padding:4px}
.drawer-b{flex:1;overflow:auto;padding:16px 20px}
.drawer-f{border-top:1px solid var(--line);padding:14px 20px 18px}
.choice{border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;cursor:pointer}
.choice.on{border-color:var(--web);box-shadow:inset 0 0 0 1px var(--web)}
.choice b{display:block;font-size:14.5px}
.choice small{color:var(--mut);font-size:12.5px}
.choice strong{font-size:17px}
.dsec{font-weight:700;font-size:16px;margin:18px 0 10px}
.prod{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px}
.prod div{flex:1}
.prod b{display:block}
.prod small{color:var(--mut)}
.facts{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.facts li{display:flex;gap:10px;align-items:flex-start}
.facts .i{color:#3F7D1F;margin-top:1px}
.pm{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.pm.on{border-color:#000;box-shadow:inset 0 0 0 1px #000}
.pm .rad{width:18px;height:18px;border-radius:50%;border:1.5px solid #333;flex:none}
.pm.on .rad{border:6px solid #000}
.pm span{flex:1}
.pm small{color:var(--mut)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:#374151;line-height:1.5;margin-top:14px;cursor:pointer}
.cbx{width:20px;height:20px;border:1.5px solid #333;border-radius:4px;flex:none;display:grid;place-items:center;margin-top:1px}
.cbx.on{background:#000;border-color:#000;color:#fff}
.consent a{color:var(--web)}
.muted-note{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.45}
.ftot{display:flex;justify-content:space-between;font-weight:700;font-size:17px;margin-bottom:10px}
.ftot span:last-child{color:var(--web)}
.btn-full{width:100%;height:50px;border:0;border-radius:4px;background:var(--web);color:#fff;font-weight:700;letter-spacing:.03em;font-size:14.5px}
.btn-full[disabled]{background:#F6B8A2;cursor:not-allowed}
.success{text-align:center;padding:26px 6px}
.success .ok{width:64px;height:64px;border-radius:50%;background:var(--greenBg);color:#3F7D1F;display:grid;place-items:center;margin:0 auto 14px}
.success h3{font-size:22px;margin:0 0 6px}
.success p{color:#4B5563;margin:0 auto 20px;max-width:36ch}
.success .mcard{margin:0 auto 22px}
.modal{background:#fff;width:440px;max-width:92%;border-radius:10px;padding:24px}
.modal h3{margin:0 0 8px;font-size:19px}
.modal p{margin:0 0 18px;color:#4B5563;line-height:1.55}
.modal .acts2{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.terms{max-width:780px;padding:6px 28px 48px}
.terms h1{font-size:28px;letter-spacing:-.02em;margin:6px 0 6px}
.terms .meta{color:var(--mut);font-size:13px;margin-bottom:22px}
.terms h2{font-size:17px;margin:26px 0 8px}
.terms p,.terms li{line-height:1.65;color:#1F2937;font-size:14.5px}
.terms ol{padding-left:20px;margin:0}
.terms .draft{background:var(--amberBg);color:#6B3B00;padding:10px 14px;border-radius:4px;font-size:13px}

/* ---- WEB MOBILE (container query) ---- */
@container web (max-width: 720px){
  .wh{padding:0 14px}
  .wh-top{height:58px;gap:12px}
  .burger{display:block}
  .logo{font-size:24px}
  .search,.wh-nav,.wh-user .uname{display:none}
  .wh-user{margin-left:auto;gap:12px}
  .wh-msearch{display:flex;border:1.5px solid #D4D6DA;border-radius:999px;height:40px;align-items:center;gap:10px;padding:0 14px;color:#8A8F98;margin:0 0 12px}
  .acc{grid-template-columns:1fr;padding:4px 14px 32px;gap:0}
  .acc-side{display:none}
  .acc-back{display:block}
  .hero{grid-template-columns:1fr;padding:20px 16px;gap:20px}
  .hero-card{order:-1}
  .hero-card .mcard{max-width:300px;transform:rotate(-3deg)}
  .hero h2{font-size:24px}
  .hero .btn-pri{width:100%}
  .steps{grid-template-columns:1fr}
  .steps li{display:grid;grid-template-columns:40px 1fr;padding:12px 0}
  .steps li::before{grid-row:span 2;margin:0}
  .member{grid-template-columns:1fr}
  .member .mcard{max-width:none}
  .stat strong{font-size:22px}
  .dl{grid-template-columns:1fr;gap:2px}
  .dl dd{margin-bottom:10px}
  .acts button{flex:1}
  .hist th:nth-child(2),.hist td:nth-child(2){display:none}
  .box{padding:14px}
  .co-head{padding:10px 14px 0}
  .co-steps{font-size:13px;gap:6px}
  .co-steps .ln{width:22px}
  .co-steps .n{width:24px;height:24px;margin-right:4px}
  .co{grid-template-columns:1fr;padding:6px 14px 28px;gap:10px}
  .opt{grid-template-columns:24px 44px 1fr auto;gap:10px;padding:12px}
  .opt .dt,.opt .inf{display:none}
  .opt .pr{text-align:right}
  .gbb{flex-wrap:wrap}
  .gbb .btn-dark{width:100%}
  .ovl{align-items:flex-end}
  .drawer{width:100%;height:92%;border-radius:16px 16px 0 0;animation:slup .25s ease-out}
  .terms{padding:4px 16px 36px}
  .terms h1{font-size:23px}
  .wfoot{padding:18px 14px}
}
@keyframes slup{from{transform:translateY(40px);opacity:.3}}

/* ============ APP ============ */
.app{font-size:15px;color:#111;background:#F6F6F7;min-height:100%;display:flex;flex-direction:column}
.app-body{flex:1;padding:0 16px 130px}
.a-head{display:flex;align-items:center;gap:12px;padding:6px 16px 10px;position:sticky;top:0;background:#F6F6F7;z-index:5}
.a-head .bk{width:46px;height:46px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.08);display:grid;place-items:center}
.a-head h1{flex:1;text-align:center;font-size:19px;margin:0 46px 0 0;font-weight:700}
.a-title{text-align:center;font-size:22px;font-weight:700;margin:10px 0 18px}
.acard{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;border:1px solid #EEEFF1}
.acard h3{margin:0 0 10px;font-size:17px}
.arow{display:flex;align-items:center;gap:14px;padding:13px 0;font-size:16px}
.arow + .arow{border-top:1px solid #F0F1F3}
.arow span{flex:1}
.arow .i:last-child{color:#555}
.gbentry{background:#000;color:#fff;border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center;margin-bottom:14px;cursor:pointer;position:relative;overflow:hidden}
.gbentry::after{content:"";position:absolute;right:-40px;top:-60px;width:160px;height:160px;background:radial-gradient(closest-side,rgba(255,68,16,.5),transparent)}
.gbentry div{flex:1;position:relative;z-index:1}
.gbentry .wm{font-size:18px}
.gbentry small{display:block;color:#C9CBD0;font-size:13px;margin-top:4px}
.gbentry .i{position:relative;z-index:1}
.tabbar{position:absolute;left:12px;right:12px;bottom:20px;height:74px;border-radius:40px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 20px rgba(0,0,0,.12);display:flex;justify-content:space-around;align-items:center;z-index:20;border:1px solid rgba(0,0,0,.06)}
.tabbar span{width:62px;height:56px;display:grid;place-items:center;border-radius:28px;position:relative}
.tabbar span.on{background:#ECECEE;color:var(--app);width:100px}
.tabbar em{position:absolute;top:2px;right:12px;background:var(--app);color:#fff;font-style:normal;font-size:11px;font-weight:700;width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.abtn{height:54px;border-radius:30px;border:0;background:var(--app);color:#fff;font-weight:700;font-size:15.5px;width:100%}
.abtn.dark{background:#000}
.abtn.ghost{background:#fff;color:#111;border:1.5px solid #E1E3E6}
.abtn.red{background:#fff;color:var(--red);border:1.5px solid #F3C7C2}
.sticky-cta{position:absolute;left:16px;right:16px;bottom:106px;z-index:15}
.a-hero{text-align:center;padding:4px 4px 6px}
.a-hero .mcard{margin:6px auto 20px;max-width:300px;transform:rotate(-3deg)}
.a-hero h2{font-size:24px;line-height:1.2;letter-spacing:-.02em;margin:0 0 8px}
.a-hero p{margin:0 0 14px;color:#4B5563}
.a-price{font-size:30px;font-weight:800;letter-spacing:-.02em}
.a-price span{font-size:15px;color:var(--mut);font-weight:500}
.a-sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.a-calc{background:var(--greenBg);border-radius:16px;padding:14px;display:flex;gap:12px;font-size:14px;margin-bottom:14px}
.a-calc .i{color:#3F7D1F}
.a-calc b{display:block}
.a-steps{list-style:none;margin:0;padding:0;counter-reset:s}
.a-steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:2px 0;padding:10px 0;font-size:14px;color:#4B5563}
.a-steps li::before{content:counter(s);grid-row:span 2;width:26px;height:26px;border-radius:50%;background:#000;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.a-steps b{color:#111;font-size:15px}
.a-cov{display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.a-cov div{display:flex;align-items:center;gap:10px}
.a-cov div span{flex:1}
.a-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.a-stats .acard{margin:0;padding:14px}
.a-stats small{display:block;color:var(--mut);font-size:12.5px}
.a-stats strong{font-size:24px;font-weight:800;letter-spacing:-.02em}
.a-kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:14.5px;border-top:1px solid #F0F1F3}
.a-kv:first-of-type{border-top:0}
.a-kv span:first-child{color:var(--mut)}
.a-kv span:last-child{text-align:right;font-weight:600}
.a-icons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.a-icons button{border:1.5px solid transparent;background:none;border-radius:16px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#374151;position:relative}
.a-icons button.on{border-color:var(--app)}
.a-icons .lk{position:absolute;top:6px;right:8px;width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.a-hist div{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #F0F1F3;font-size:14px}
.a-hist div:first-of-type{border-top:0}
.a-hist small{display:block;color:var(--mut)}
.a-faq .faq button{font-size:15px}
.a-terms{text-align:center;font-size:13px;color:var(--mut);padding:8px 0 20px}
.a-terms a{color:var(--app);font-weight:600;cursor:pointer}
.a-notice{border-radius:16px;padding:14px;display:flex;gap:12px;font-size:14px;margin-bottom:14px}
.a-notice b{display:block}
.a-notice.red{background:var(--redBg);color:#7A1A12}
.a-notice.amber{background:var(--amberBg);color:#6B3B00}

/* savings viz */
.sv{border:1.5px solid var(--line);border-radius:6px;padding:22px;margin-top:16px;display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:center;background:#fff}
.sv-head small{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.sv-head strong{display:block;font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;color:#2F7D17}
.sv-head span{display:block;font-size:14px;color:#374151;margin-top:8px;line-height:1.45}
.sv-rows{display:flex;flex-direction:column;gap:16px}
.sv-lab{display:flex;justify-content:space-between;font-size:13px;color:#4B5563;margin-bottom:6px}
.sv-lab small{color:var(--mut)}
.sv-bar{height:34px;border-radius:8px;background:var(--soft);display:flex;overflow:hidden;font-size:13.5px;font-weight:700}
.sv-bar i{display:flex;align-items:center;padding:0 12px;font-style:normal;white-space:nowrap}
.sv-bar .paid{background:#4B5563;color:#fff;justify-content:flex-end}
.sv-bar .gbp{background:linear-gradient(90deg,var(--appA),var(--app));color:#fff}
.sv-bar .save{background:repeating-linear-gradient(135deg,#D6EDC8 0 7px,#E9F5E1 7px 14px);color:#2F7D17;justify-content:center;border-left:2px solid #fff}
.sv-foot{font-size:12px;color:var(--mut);margin-top:2px}
.sv.dark{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#fff}
.sv.dark .sv-head strong{color:#8FD16A}
.sv.dark .sv-head small,.sv.dark .sv-head span,.sv.dark .sv-lab,.sv.dark .sv-foot{color:#C9CBD0}
.sv.dark .sv-bar{background:rgba(255,255,255,.1)}
.sv.dark .sv-bar .paid{background:#6B7280}
.sv.dark .sv-bar .save{background:repeating-linear-gradient(135deg,rgba(143,209,106,.35) 0 7px,rgba(143,209,106,.15) 7px 14px);color:#B6E69A;border-left-color:#000}
.sv.app,.sv.dark{grid-template-columns:1fr;gap:16px;padding:16px;border-radius:18px}
.sv.app{border:1px solid #EEEFF1;margin:0 0 14px}
.sv.app .sv-head strong,.sv.dark .sv-head strong{font-size:32px}
.sv.dark{margin:0 0 20px;text-align:left}
/* locker card */
.acard .lk{flex-direction:column;gap:12px}
.acard .lk-ic{width:44px;height:44px;border-radius:12px}
.lk{display:flex;gap:18px;align-items:flex-start}
.lk-ic{width:56px;height:56px;border-radius:14px;background:linear-gradient(145deg,var(--appA),var(--app));color:#fff;display:grid;place-items:center;flex:none}
.lk b{display:block;font-size:16px;margin-bottom:4px}
.lk p{margin:0 0 10px;color:#4B5563;line-height:1.5;max-width:60ch}
.lk-ch{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lk-ch span{background:var(--soft);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.lk-ch button{margin-left:6px}
@container web (max-width:720px){.sv{grid-template-columns:1fr;gap:16px;padding:16px}.sv-head strong{font-size:32px}}

/* promo */
.promo{min-height:100%;background:#000;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:0 24px 34px}
.promo::before{content:"";position:absolute;left:50%;top:-140px;width:560px;height:560px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,68,16,.55),rgba(255,68,16,0))}
.promo > *{position:relative}
.promo .x{position:absolute;top:4px;right:18px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);border:0;color:#fff;display:grid;place-items:center;z-index:3}
.promo .wm{font-size:26px;text-align:center;margin-top:14px}
.promo .mcard{margin:22px auto 24px;max-width:300px;transform:rotate(-6deg);box-shadow:0 30px 60px rgba(255,68,16,.28),0 0 0 1px rgba(255,255,255,.12);animation:cardin .9s cubic-bezier(.2,.8,.2,1)}
@keyframes cardin{from{transform:translateY(40px) rotate(-18deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.promo .mcard,.drawer,.sheet{animation:none}}
.promo h2{font-size:28px;line-height:1.15;letter-spacing:-.025em;margin:0 0 16px;text-align:center}
.promo ul{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-direction:column;gap:10px;font-size:15px;color:#E5E7EB}
.promo li{display:flex;gap:10px;align-items:center}
.promo li .i{color:var(--app2)}
.promo .pers{background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;font-size:13.5px;color:#E5E7EB;margin-bottom:22px}
.promo .pers b{color:#fff}
.promo .abtn{margin-bottom:8px}
.promo .later{background:none;border:0;color:#fff;font-weight:600;height:44px;width:100%}
.promo .legal{text-align:center;font-size:11.5px;color:#9CA3AF;margin-top:4px}
.promo .more{text-align:center;font-size:13px;color:#fff;text-decoration:underline;cursor:pointer;margin-bottom:6px;background:none;border:0}

/* app checkout */
.aship{background:#fff;border-radius:18px;padding:14px 14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;border:1.5px solid #EEEFF1;cursor:pointer}
.aship.sel{border-color:var(--app)}
.aship .lg{width:48px;height:36px;border-radius:8px;display:grid;place-items:center;font-size:8.5px;font-weight:800;color:#fff;flex:none}
.aship div{flex:1}
.aship b{display:block;font-size:15px;font-weight:600}
.aship small{color:var(--mut);font-size:13px}
.aship .pr{font-weight:700;font-size:14.5px;text-align:right;white-space:nowrap}
.aship .pr.free{color:var(--green)}
.aship .pr s{display:block;color:#9CA3AF;font-weight:400;font-size:12px}
.abanner{background:#000;color:#fff;border-radius:18px;padding:14px;margin-bottom:14px;position:relative;overflow:hidden}
.abanner::after{content:"";position:absolute;right:-50px;top:-70px;width:180px;height:180px;background:radial-gradient(closest-side,rgba(255,68,16,.5),transparent)}
.abanner > *{position:relative;z-index:1}
.abanner .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);border:0;color:#fff;display:grid;place-items:center;z-index:2}
.abanner .top{display:flex;gap:12px;align-items:center;padding-right:30px}
.abanner b{display:block;font-size:15px}
.abanner small{color:#C9CBD0;font-size:13px;display:block;margin-top:2px}
.abanner .abtn{height:44px;margin-top:12px;font-size:14.5px}
.abanner.in{background:var(--greenBg);color:#2F5E17}
.abanner.in::after{display:none}
.abanner.in small{color:#3F6B28}
.abanner.in .lnk2{background:none;border:0;color:#2F5E17;font-weight:700;text-decoration:underline;padding:0;margin-top:8px;font-size:13.5px}
.a-sumbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ECEDEF;padding:12px 16px 108px;z-index:14;font-size:14px}
.a-sumbar .r{display:flex;justify-content:space-between;padding:2px 0;color:#4B5563}
.a-sumbar .r b{color:#111}
.a-sumbar .abtn{margin-top:10px}

/* app sheet */
.aovl{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;height:92%;border-radius:30px 30px 0 0;display:flex;flex-direction:column;animation:slup .28s ease-out}
.sheet-b{flex:1;overflow:auto;padding:18px 16px 10px}
.sheet-f{padding:10px 16px 26px;border-top:1px solid #F0F1F3}
.sheet .choice{border-radius:16px}
.sheet .choice.on{border-color:var(--app);box-shadow:inset 0 0 0 1px var(--app)}
.sheet .btn-full{height:54px;border-radius:30px;background:var(--app)}
.sheet .btn-full[disabled]{background:#FFB9A4}
.sheet .consent a{color:var(--app)}
.grab{width:44px;height:5px;background:#D5D7DB;border-radius:9px;margin:10px auto 0}
.ios-alert{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:35;display:grid;place-items:center}
.ios-alert div{width:270px;background:rgba(245,245,247,.97);border-radius:14px;text-align:center;overflow:hidden}
.ios-alert p{margin:0;padding:18px 16px 16px;font-size:14px;line-height:1.35}
.ios-alert p b{display:block;font-size:16px;margin-bottom:4px}
.ios-alert button{display:block;width:100%;border:0;border-top:1px solid #D1D1D6;background:none;height:44px;color:#0A84FF;font-size:16px}
.ios-alert button + button{font-weight:600}

/* home screen */
.home{min-height:100%;background:linear-gradient(180deg,#3E8FD6,#5AA7E6 50%,#7CB9EB);padding:10px 22px;color:#fff}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 14px;margin-top:20px}
.hgrid div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:500}
.hgrid i{display:block;width:62px;height:62px;border-radius:14px}
.hgrid .gb{position:relative}
.hgrid .gb::after{content:"";position:absolute;left:-2px;bottom:18px;width:8px;height:8px;border-radius:50%;background:#FFD43B}
.dock{position:absolute;left:14px;right:14px;bottom:24px;height:90px;border-radius:32px;background:rgba(255,255,255,.28);display:flex;justify-content:space-around;align-items:center}
.dock i{display:block;width:62px;height:62px;border-radius:14px;background:rgba(255,255,255,.55)}
.home .lab{background:rgba(0,0,0,.35);border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:26px;line-height:1.45}
/* ===== v2 ===== */
.stage{flex-direction:column;align-items:center;gap:18px}
.spec{width:min(1200px,100%);background:#fff;border-radius:14px;padding:16px 20px 6px;font-size:13px;line-height:1.5;box-shadow:0 1px 2px rgba(0,0,0,.06);border-left:4px solid var(--app)}
.spec-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.spec-h h4{margin:0;font-size:16px}
.spec-tag{background:#000;color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.02em}
.spec-b{columns:300px 3;column-gap:28px}
.spec section{break-inside:avoid;margin-bottom:10px}
.spec h5{margin:4px 0 4px;font-size:12.5px;color:#374151;text-transform:uppercase;letter-spacing:.04em}
.spec ul{margin:0;padding-left:18px}.spec li{margin:3px 0}
.spec .tag{display:inline-block;background:var(--amberBg);color:#8A4B00;border-radius:6px;padding:1px 6px;font-size:11.5px;font-weight:600}
.flash{display:flex;gap:10px;align-items:center;background:#EAF6E3;color:#2F5E17;border-top:1px solid #CFE8C0;border-bottom:1px solid #CFE8C0;padding:12px 28px;font-size:14px;font-weight:500;animation:flin .3s ease-out}
@keyframes flin{from{opacity:0;transform:translateY(-6px)}}
.ord{padding:0}
.ord-h{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:16px;font-weight:700;font-size:16px;color:#111}
.ord-e{color:var(--web);font-weight:500;font-size:14px;display:flex;align-items:center;gap:4px}
.ord-b{padding:0 16px 8px}
.oi{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.oi:first-child{border-top:0}
.oi-img{position:relative;width:44px;height:52px;border-radius:6px;flex:none;display:grid;place-items:center}
.oi.gb .oi-img{height:44px}
.oi-img em{position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;background:#444;color:#fff;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;z-index:2}
.oi-t{flex:1;font-size:13.5px;font-weight:500;line-height:1.4}
.oi-t small{display:block;color:var(--mut);font-weight:400;font-size:12px;margin:2px 0 4px}
.oi-t .lnk{font-size:12.5px}
.oi-p{color:var(--web);font-size:14px;white-space:nowrap}
.cmodal{width:500px}
.cm-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.cm-h button{border:0;background:none;padding:2px}
.cm-desc{color:#4B5563;margin:0 0 14px!important;font-size:14px}
.curchip{display:inline-block;background:var(--greenBg);color:#3F7D1F;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}

.ncard small{color:var(--mut);display:flex;gap:6px;align-items:center;font-size:12px}
.aflash{display:flex;gap:10px;align-items:center;background:#EAF6E3;color:#2F5E17;border:1px solid #CFE8C0;border-radius:16px;padding:12px 14px;font-size:14px;font-weight:500;margin-bottom:14px;animation:flin .3s ease-out}
.pk{background:#fff;border-radius:22px;border:1px solid #EEEFF1;padding:16px 18px;margin-bottom:14px}
.pk-h{display:flex;gap:14px;align-items:center;font-weight:700;font-size:17px;padding-bottom:12px;border-bottom:1px solid #EEEFF1;color:#222}
.pk-h .i{color:#555}
.pk-b{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:12px}
.pk-b > div{flex:1}
.pk-name{display:block;color:var(--app);font-weight:700;font-size:16px}
.pk-sub{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.pk-mut{color:var(--mut);font-size:16px;flex:1}
.pk-btn{border:1.5px solid #111;border-radius:14px;background:#fff;padding:9px 18px;font-weight:600;font-size:15px;flex:none}
.pk-row{display:flex;align-items:center;gap:14px;font-size:15.5px}
.pk-row span{flex:1}
.pk-cta{position:absolute;left:16px;right:16px;bottom:106px;z-index:15}

.sh{background:#fff;border-radius:22px;border:1.5px solid #EEEFF1;padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:12px;cursor:pointer}

.sh-lg{width:62px;height:46px;border-radius:10px;border:1px solid #EEEFF1;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;overflow:hidden}
.sh-lg i{font-style:normal;display:grid;place-items:center;width:48px;height:30px;border-radius:5px;font-size:11px}
.sh-t{flex:1;display:flex;flex-direction:column}

.lk2{position:absolute;top:8px;right:28%;width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.ia-prev{display:flex;align-items:center;justify-content:center;gap:12px;padding:0 0 14px;color:#6B7280}

.promo-price b{color:#fff;font-size:26px;font-weight:800}
</style>
</head>
<body>
<div class="tb" id="tb"></div>
<div class="stage" id="stage"></div>
<script>
/* ================== STATE ================== */
const S = {
  platform:'web',
  screen:{web:'plus', mweb:'plus', app:'promo'},
  status:'inactive', fresh:false,
  bannerClosed:false, gbInCart:false, ship:null, orderOpen:false, flash:'',
  cancelOpen:false, cardOpen:false, card:'visa', cardSel:'visa',
  instantDone:false, pm:'saved', consent:false,
  icon:'classic', iconAsk:false, iconAlert:false, faq:{}, toast:''
};
const SCREENS = {
  web:[['plus','Účet → GymBeam+'],['checkout','Checkout – krok doručenie'],['instant','Instant checkout GymBeam+'],['card','Zmena platobnej metódy'],['terms','Obchodné podmienky GymBeam+']],
  app:[['promo','Promo screen'],['menu','Účet – menu'],['plus','GymBeam+ v účte'],['instant','Instant checkout'],['card','Zmena platobnej metódy'],['icon','Prémiová ikona'],['checkout','Pokladňa'],['shipping','Spôsob dopravy']]
};
const STATUS = {inactive:'Neaktívne', active:'Aktívne', cancelled:'Aktívne – obnovenie zrušené', failed:'Neúspešná platba pri obnovení'};
const P = {price:9.90, box:1.49, until:'28. 9. 2027', webCart:6.50, appCart:28.49};
const CARDS = {visa:['Visa •••• 4417','Platnosť 08/28'], mc:['Mastercard •••• 8820','Platnosť 11/27'], wallet:['Apple Pay / Google Pay','Rýchla platba'], new:['Visa •••• 1234','Nová karta']};
const cardLbl = (app) => S.card==='wallet' ? (app?'Apple Pay':'Apple Pay / Google Pay') : CARDS[S.card][0];
const eur = n => n.toFixed(2).replace('.',',')+' €';
const key = () => S.platform==='mweb' ? 'web' : S.platform;
const cur = () => S.screen[S.platform];
const isMember = () => S.status==='active' || S.status==='cancelled';
const boxFree = () => isMember() || S.gbInCart;

/* ================== ICONS ================== */
const IC = {
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
  basket:'<path d="M3 9h18l-2 11H5z"/><path d="M8 9l4-6 4 6M9 13v4M15 13v4"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  up:'<path d="M6 15l6-6 6 6"/>', down:'<path d="M6 9l6 6 6-6"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  box:'<path d="M3 7.5l9-4.5 9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/>',
  card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
  truck:'<path d="M2 6h12v10H2zM14 10h4l3 3v3h-7"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/>',
  refresh:'<path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M4 4v4h4M20 20v-4h-4"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.4"/>',
  bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
  receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 11h6M9 15h6"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.3"/>',
  pkg:'<path d="M3 7.5l9-4.5 9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5"/>',
  ret:'<path d="M9 14l-5-5 5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  pin:'<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  gift:'<rect x="3" y="8" width="18" height="5"/><path d="M5 13v8h14v-8M12 8v13M12 8S10 3 7.5 4 8 8 12 8zm0 0s2-5 4.5-4S16 8 12 8z"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  grid:'<rect x="4" y="4" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="13" y="4" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="4" y="13" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="13" y="13" width="7" height="7" rx="1.5" fill="currentColor"/>',
  cart:'<path d="M3 4h2l2.5 11h11L21 7H6.5" /><circle cx="9" cy="19" r="1.6" fill="currentColor"/><circle cx="17" cy="19" r="1.6" fill="currentColor"/>'
};
const ic = (n,s=20,w=1.8) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

let gid=0;
function gSvg(fill){
  const id='gg'+(gid++);
  const def = fill==='grad' ? `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFA633"/><stop offset="1" stop-color="#FF4410"/></linearGradient></defs>` : '';
  const f = fill==='grad' ? `url(#${id})` : fill;
  return `<svg viewBox="0 0 100 100">${def}<text x="55" y="75" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-style="italic" font-size="76" fill="${f}">G</text><path d="M6 49 H46 L43.5 56 H3.5 Z" fill="${f}"/></svg>`;
}
const ICONS = {
  classic:{n:'Klasická', bg:'#000', g:'#fff'},
  plus:{n:'GymBeam+', bg:'#000', g:'grad', p:'#FF6840'}
};
function appIcon(v,size){
  const o=ICONS[v];
  return `<span class="aicon" style="width:${size}px;height:${size}px;background:${o.bg}">${gSvg(o.g)}${o.p?`<b style="color:${o.p};font-size:${Math.round(size*.36)}px">+</b>`:''}</span>`;
}
const wm = (cls='') => `<span class="wm ${cls}">GymBeam<b>+</b></span>`;
const lines = `<svg class="mc-lines" viewBox="0 0 320 200" preserveAspectRatio="none" aria-hidden="true"><g stroke="#FF4410" stroke-width="2" opacity=".55"><path d="M170 200 L300 20"/><path d="M200 200 L320 40" opacity=".6"/><path d="M230 200 L330 70" opacity=".35"/></g></svg>`;
function mcard(on, promo){
  if(!on) return `<div class="mcard off"><div class="mc-top">${wm()}</div><div class="mc-mid">Tu bude vaša členská karta</div><div class="mc-bot"><span>Yevhenii Malovanyi</span></div></div>`;
  const chip = promo ? 'Nové' : ({active:'Aktívne',cancelled:'Bez obnovenia',failed:'Čaká na platbu'}[S.status]||'Aktívne');
  const paused = !promo && S.status==='failed';
  const since = (promo||S.fresh) ? '09/2026' : '09/2025';
  return `<div class="mcard ${paused?'paused':''}">${lines}<div class="mc-top">${wm('light')}<span class="mc-chip">${chip}</span></div><div class="mc-name">Yevhenii Malovanyi</div><div class="mc-bot"><div><small>Člen od</small>${since}</div><div><small>${paused?'Stav':'Platí do'}</small>${paused?'Pozastavené':P.until}</div></div></div>`;
}

/* ================== CONTENT ================== */
const FAQ = [
  ['Čo je GymBeam+?','Ročné predplatné, s ktorým máte dopravu do GymBeam Boxu zadarmo pri každej objednávke – bez ohľadu na jej hodnotu.'],
  ['Na ktoré doručenie sa doprava zadarmo vzťahuje?','Na doručenie do GymBeam Boxov – našich vlastných výdajných boxov. Pri ostatných spôsoboch doručenia platíte bežnú cenu.'],
  ['Koľko GymBeam+ stojí?','9,90 € na rok. Presnú sumu vidíte pred zaplatením aj v pripomienkovom e-maile pred každým obnovením.'],
  ['Ako funguje automatické obnovenie?','Rok od aktivácie vám predplatné automaticky strhneme z uloženej platobnej metódy. 7 dní vopred vám pošleme e-mail so sumou a dátumom platby.'],
  ['Môžem zmeniť kartu, z ktorej sa predplatné strháva?','Áno. V účte v sekcii GymBeam+ kliknite pri platobnej metóde na „Zmeniť“ a vyberte inú uloženú kartu alebo pridajte novú.'],
  ['Ako predplatné zruším?','V účte v sekcii GymBeam+ kliknite na „Zrušiť obnovenie“, prípadne cez odkaz v pripomienkovom e-maile. GymBeam+ vám zostane aktívne do konca zaplateného obdobia.'],
  ['Čo sa stane, ak platba pri obnovení neprejde?','Predplatné sa neobnoví a pošleme vám e-mail s odkazom na zaplatenie. Po úhrade vám GymBeam+ znova aktivujeme.'],
  ['Platí doprava zadarmo už pri objednávke, v ktorej si GymBeam+ kupujem?','Áno. Ak si GymBeam+ pridáte do košíka a vyberiete GymBeam Box, doprava v tejto objednávke je už zadarmo.'],
  ['Ako môžem GymBeam+ zaplatiť?','Platobnou kartou, Apple Pay alebo Google Pay. Kvôli automatickému obnoveniu nie je možné platiť na dobierku ani výplatnou páskou.'],
  ['Môžem od predplatného odstúpiť?','Áno, do 14 dní od aktivácie bez udania dôvodu. Ak ste už dopravu zadarmo využili, vrátime vám sumu zníženú o hodnotu využitých doručení.']
];
const STEPS = [
  ['Aktivujete GymBeam+','V účte alebo v pokladni, jedným kliknutím.'],
  ['Vyberiete GymBeam Box','Pri každej objednávke v kroku doručenie.'],
  ['Za dopravu neplatíte','Bez ohľadu na hodnotu objednávky.'],
  ['Po roku sa obnoví','7 dní vopred vám pošleme pripomienku.']
];
const HIST = () => {
  if(S.fresh) return [['28. 9. 2026','Aktivácia – ročné predplatné','9,90 €',1]];
  const first = ['28. 9. 2026','Obnovenie – ročné predplatné','9,90 €', S.status==='failed'?0:1];
  return [first,['28. 9. 2025','Aktivácia – ročné predplatné','9,90 €',1]];
};
const SAV = () => S.fresh ? {tot:'0,00 €',n:0} : {tot:'14,90 €',n:10};

function saveViz(tone){
  const pct=Math.round(9.90/20.86*100);
  return `<div class="sv ${tone}">
    <div class="sv-head"><small>Za posledných 12 mesiacov</small><strong>−10,96 €</strong><span>Toľko by ste ušetrili s GymBeam+ na doručení do GymBeam Boxu.</span></div>
    <div class="sv-rows">
      <div><div class="sv-lab"><span>Zaplatili ste za doručenie</span><small>14 objednávok × 1,49 €</small></div><div class="sv-bar"><i class="paid" style="width:100%">20,86 €</i></div></div>
      <div><div class="sv-lab"><span>S GymBeam+ by ste zaplatili</span><small>1 ročná platba</small></div><div class="sv-bar"><i class="gbp" style="width:${pct}%">9,90 €</i><i class="save" style="width:${100-pct}%">ušetríte</i></div></div>
      <div class="sv-foot">Vypočítané z vašich objednávok do GymBeam Boxu.</div>
    </div></div>`;
}
const lockerCard = () => `<div class="lk"><span class="lk-ic">${ic('box',28,2)}</span><div><b>Doručenie do GymBeam Boxov</b><p>Doprava zadarmo platí pri doručení do našich vlastných výdajných boxov. V pokladni stačí vybrať GymBeam Box a za dopravu neplatíte nič – bez ohľadu na hodnotu objednávky.</p><button class="lnk" data-a="toast" data-v="Otvorí sa mapa GymBeam Boxov">Nájsť najbližší box</button></div></div>`;
const faqList = () => FAQ.map((f,i)=>`<div class="faq ${S.faq[i]?'open':''}"><button data-a="faq" data-v="${i}" aria-expanded="${!!S.faq[i]}">${f[0]} ${ic('chev',18)}</button>${S.faq[i]?`<p>${f[1]}</p>`:''}</div>`).join('');
const stateLbl = () => ({active:'Aktívne',cancelled:'Aktívne – bez obnovenia',failed:'Neaktívne – čaká na platbu'}[S.status]);
const stateDot = () => ({active:'var(--green)',cancelled:'#F59E0B',failed:'var(--red)'}[S.status]);
const nextPay = () => ({active:`9,90 € – ${P.until} (automaticky)`,cancelled:'Žiadna – obnovenie ste zrušili',failed:'9,90 € – čaká na úhradu'}[S.status]);

/* ================== WEB ================== */
function webHeader(){
  return `<div class="wh"><div class="wh-top"><button class="burger" aria-label="Menu">${ic('menu',24)}</button><div class="logo">GymBeam<sup>®</sup></div><div class="search">${ic('search',18)} Hľadajte v obchode...</div><div class="wh-user"><span class="uname">Yevhenii Malovanyi</span>${ic('user',24)}${ic('heart',24)}${ic('basket',26)}</div></div>
  <div class="wh-msearch">${ic('search',18)} Hľadajte v obchode...</div>
  <nav class="wh-nav"><span>POTRAVINY</span><span>PROTEÍNY</span><span>ŠPORTOVÁ VÝŽIVA</span><span>OBLEČENIE</span><span>PRÍSLUŠENSTVO</span><span>TOP PONUKY</span></nav></div>`;
}
const webFoot = () => `<div class="wfoot"><span>© GymBeam</span><span>Obchodné podmienky · Ochrana osobných údajov · <a data-a="terms" style="cursor:pointer;color:#fff">Obchodné podmienky GymBeam+</a></span></div>`;
function accLayout(inner){
  const items=['Účet','Objednávky','Vrátenia','Predplatné','GymBeam+','Zoznam adries','Informácie o účte','Výsledky DNA testov','Uložené metódy platby','Darčekový poukaz','Recenzie produktov','Odber noviniek','Rýchle objednávanie','Notifikácia o dostupnosti'];
  return `<div class="acc"><aside class="acc-side">${items.map(t=>t==='GymBeam+'?`<a class="on" href="#">GymBeam+ <span class="new">NOVÉ</span></a>`:`<a href="#">${t}</a>`).join('')}</aside><main><div class="acc-back">‹ Späť do účtu</div>${inner}</main></div>`;
}
const termsFoot = () => `<div class="terms-foot"><span>Predplatné sa riadi Obchodnými podmienkami GymBeam+ a Všeobecnými obchodnými podmienkami.</span><button class="lnk" data-a="terms">Obchodné podmienky GymBeam+</button></div>`;

function plusWeb(){
  const head = `<h1 class="acc-title">GymBeam+</h1>`;
  if(S.status==='inactive') return head + `
  <section class="hero">
    <div>
      ${wm()}
      <h2>Doprava do GymBeam Boxu zadarmo. Pri každej objednávke, celý rok.</h2>
      <p>Bez minimálnej hodnoty objednávky – aj keď si objednáte jednu proteínovú tyčinku.</p>
      <div class="price"><strong>9,90 €</strong><span>/ rok</span></div>
      <small>Vychádza na 0,83 € mesačne. Predplatné sa po roku automaticky obnoví, zrušiť ho môžete kedykoľvek v účte.</small>
      <div class="row"><button class="btn-pri" data-a="buy">AKTIVOVAŤ GYMBEAM+</button><a class="lnk" href="#faq-web">Časté otázky</a></div>
    </div>
    <div class="hero-card">${mcard(false)}</div>
  </section>
  ${saveViz('')}
  <div class="barh">Ako to funguje</div><div class="box" style="padding-top:4px;padding-bottom:4px"><ol class="steps">${STEPS.map(s=>`<li><b>${s[0]}</b><span>${s[1]}</span></li>`).join('')}</ol></div>
  <div class="barh">Kde doprava zadarmo platí</div><div class="box">${lockerCard()}</div>
  <div class="barh" id="faq-web">Časté otázky</div><div class="box" style="padding-top:4px;padding-bottom:4px">${faqList()}</div>
  ${termsFoot()}`;

  const sv=SAV();
  const notice = {
    cancelled:`<div class="notice amber">${ic('info',20)}<div><b>Automatické obnovenie je zrušené</b>GymBeam+ vám platí do ${P.until}. Potom sa už neobnoví a doprava do GymBeam Boxu bude opäť spoplatnená.</div></div>`,
    failed:`<div class="notice red">${ic('alert',20)}<div><b>Platba za obnovenie neprešla</b>Sumu 9,90 € sa nám 28. 9. 2026 nepodarilo strhnúť z karty ${cardLbl()}. GymBeam+ je preto neaktívne. Zaplaťte cez tlačidlo nižšie alebo cez odkaz v e-maile, prípadne zmeňte kartu.</div></div>`,
    active: S.fresh?`<div class="notice green">${ic('check',20)}<div><b>Vitajte v GymBeam+</b>Doprava do GymBeam Boxu je odteraz zadarmo. Potvrdenie a faktúru sme vám poslali na e-mail.</div></div>`:''
  }[S.status]||'';
  const acts = {
    active:`<button class="btn-out" data-a="cardOpen">ZMENIŤ PLATOBNÚ METÓDU</button><button class="btn-out" data-a="cancelOpen">ZRUŠIŤ OBNOVENIE</button>`,
    cancelled:`<button class="btn-pri" data-a="renew">ZAPNÚŤ OBNOVENIE</button><button class="btn-out" data-a="cardOpen">ZMENIŤ PLATOBNÚ METÓDU</button>`,
    failed:`<button class="btn-pri" data-a="buy">ZAPLATIŤ 9,90 €</button><button class="btn-out" data-a="cardOpen">ZMENIŤ PLATOBNÚ METÓDU</button>`
  }[S.status];
  return head + notice + `
  <section class="member">
    <div>${mcard(true)}</div>

    inner = ({promo:appPromo,menu:appMenu,plus:appPlus,instant:appPlus,card:appPlus,icon:appHome,checkout:appCheckout,shipping:appShipping,terms:appTerms}[sc])();
    if(sc==='instant') overlay = instantApp();
    if(S.cardOpen) overlay = cardSheetApp();
    if(S.cancelOpen) overlay = cancelModal(true);
    if(S.iconAsk) overlay = `<div class="ios-alert"><div><p><b>Zmeniť ikonu aplikácie?</b>Ako člen GymBeam+ môžete mať na ploche prémiovú ikonu.</p><div class="ia-prev">${appIcon('classic',48)}<span>→</span>${appIcon('plus',48)}</div><button data-a="iconNo">Teraz nie</button><button data-a="iconYes">Zmeniť ikonu</button></div></div>`;
    if(S.iconAlert) overlay = `<div class="ios-alert"><div><p><b>Ikona bola zmenená</b>Zmenili ste ikonu pre „GymBeam“.</p><button data-a="iconOk">OK</button><button data-a="iconHome">Zobraziť plochu</button></div></div>`;
  }
  const toast = S.toast ? `<div class="toast">${S.toast}</div>` : '';
  let frame;
  if(S.platform==='web') frame = `<div class="browser"><div class="browser-bar"><i></i><i></i><i></i><span>gymbeam.sk/${sc==='checkout'?'checkout/#shipping':sc==='terms'?'obchodne-podmienky-gymbeam-plus':'customer/gymbeam-plus'}</span></div><div class="vp-wrap"><div class="viewport">${inner}</div>${overlay}${toast}</div></div>`;
  else if(S.platform==='mweb') frame = `<div class="phone"><div class="vp-wrap"><div class="mweb-wrap">${sbar()}<div class="urlbar">gymbeam.sk</div><div class="viewport">${inner}</div></div>${overlay}${toast}</div></div>`;
  else { const [body,fixed='']=inner.split('<!--FIXED-->'); frame = `<div class="phone"><div class="vp-wrap"><div class="viewport">${body}</div>${fixed}${overlay}${toast}</div></div>`; }
  const sp = SPEC[`${k}.${sc}`] || ['',''];
  const pre = S.platform==='mweb' ? `<section><h5>Mobile web</h5><ul><li>Rovnaký obsah a logika ako desktop, layout cez container query (≤ 720 px); drawery a modaly ako bottom sheet.</li></ul></section>` : '';
  const spec = `<div class="spec"><div class="spec-h"><span class="spec-tag">Popis obrazovky</span><h4>${sp[0]}</h4></div><div class="spec-b">${pre}${sp.slice(1).join('')}</div></div>`;
  return spec + frame;
}
let lastKey='';
function render(){
  const vp=document.querySelector('.viewport'); const top=vp?vp.scrollTop:0;
  const rk=S.platform+cur();
  document.getElementById('tb').innerHTML=toolbar();
  document.getElementById('stage').innerHTML=stage();
  const nv=document.querySelector('.viewport');
  if(nv && rk===lastKey) nv.scrollTop=top;
  lastKey=rk;
}
let tt, ft;
function toast(t){ S.toast=t; render(); clearTimeout(tt); tt=setTimeout(()=>{S.toast='';render();},2600); }
function flash(t){ S.flash=t; clearTimeout(ft); ft=setTimeout(()=>{S.flash='';render();},4000); }
function goScreen(v){ S.screen[S.platform]=v; S.cancelOpen=false; S.iconAlert=false; S.iconAsk=false; S.cardOpen = v==='card'; if(v==='card'){ S.cardSel=S.card; if(S.status==='inactive') S.status='active'; } if(v!=='instant'){S.instantDone=false;S.consent=false;} }

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el || el.tagName==='SELECT') return;
  const a=el.dataset.a, v=el.dataset.v;
  if(el.tagName==='A' && el.getAttribute('href')==='#') e.preventDefault();
  switch(a){
    case 'plat': S.platform=v; S.gbInCart=false; S.ship=null; S.orderOpen=false; S.flash=''; S.bannerClosed=false; S.cancelOpen=false; S.iconAlert=false; S.iconAsk=false; S.cardOpen = cur()==='card'; break;
    case 'scr': goScreen(v); if(v==='checkout'&&key()==='web'){S.ship=null;} break;
    case 'go': goScreen(v); break;
    case 'goPlus': goScreen('plus'); break;
    case 'goShipping': goScreen('shipping'); break;
    case 'terms': e.stopPropagation(); goScreen('terms'); break;
    case 'buy': S.instantDone=false; S.consent=false; S.pm='saved'; S.cardOpen=false; S.screen[S.platform]='instant'; break;
    case 'closeInstant': goScreen('plus'); break;
    case 'pm': S.pm=v; break;
    case 'consent': if(e.target.closest('a')) return; S.consent=!S.consent; break;
    case 'pay': if(!S.consent) return; S.fresh = S.status==='inactive' || S.fresh; S.status='active'; S.instantDone=true; if(S.pm==='wallet') S.card='wallet'; if(S.pm==='new') S.card='new'; break;
    case 'afterPay': goScreen('plus'); if(key()==='app' && S.icon==='classic') S.iconAsk=true; break;
    case 'faq': S.faq[v]=!S.faq[v]; break;
    case 'cancelOpen': S.cancelOpen=true; break;
    case 'cancelClose': S.cancelOpen=false; break;
    case 'cancelConfirm': S.cancelOpen=false; S.status='cancelled'; toast('Obnovenie zrušené. GymBeam+ platí do '+P.until+'.'); return;
    case 'renew': S.status='active'; toast('Automatické obnovenie je znova zapnuté.'); return;
    case 'cardOpen': S.cardOpen=true; S.cardSel=S.card; break;
    case 'cardSel': S.cardSel=v; break;
    case 'cardClose': S.cardOpen=false; if(cur()==='card') S.screen[S.platform]='plus'; break;
    case 'cardSave': if(S.cardSel===S.card && S.card!=='new') return; S.card=S.cardSel; S.cardOpen=false; if(cur()==='card') S.screen[S.platform]='plus'; toast('Platobná metóda pre GymBeam+ bola zmenená.'); return;
    case 'bannerClose': S.bannerClosed=true; toast('Banner skrytý na 7 dní.'); return;
    case 'addGb': S.gbInCart=true; S.ship = key()==='web' ? 'box' : S.ship; S.orderOpen=true; flash('GymBeam+ ročné predplatné bolo pridané do košíka.'); break;
    case 'removeGb': S.gbInCart=false; break;
    case 'orderToggle': S.orderOpen=!S.orderOpen; break;
    case 'ship': S.ship=v; break;
    case 'shipApp': S.ship=v; break;
    case 'shipConfirm': if(!S.ship) return; goScreen('checkout'); break;
    case 'icon': if(!isMember() && v!=='classic'){ toast('Prémiová ikona je dostupná s GymBeam+.'); return; } if(S.icon===v) return; S.icon=v; S.iconAlert=true; break;
    case 'iconYes': S.iconAsk=false; S.icon='plus'; S.iconAlert=true; break;
    case 'iconNo': S.iconAsk=false; toast('Ikonu si môžete zmeniť neskôr v sekcii GymBeam+.'); return;
    case 'iconOk': S.iconAlert=false; break;
    case 'iconHome': S.iconAlert=false; goScreen('icon'); break;
    case 'promoClose': goScreen('menu'); toast('Promo zobrazíme znova o 14 dní.'); return;
    case 'toast': toast(v); return;
    case 'reset': clearTimeout(ft); Object.assign(S,{status:'inactive',fresh:false,bannerClosed:false,gbInCart:false,ship:null,orderOpen:false,flash:'',cancelOpen:false,cardOpen:false,card:'visa',cardSel:'visa',instantDone:false,pm:'saved',consent:false,icon:'classic',iconAsk:false,iconAlert:false,faq:{}}); break;
  }
  render();
});
document.addEventListener('change',e=>{ if(e.target.dataset.a==='status'){ S.status=e.target.value; S.fresh=false; S.cancelOpen=false; if(!isMember()) S.icon='classic'; render(); } });
render();

</script>
</body>
</html>
