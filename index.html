:#2F5E17}\n.abanner.in::after{display:none}\n.abanner.in small{color:#3F6B28}\n.abanner.in .lnk2{background:none;border:0;color:#2F5E17;font-weight:700;text-decoration:underline;padding:0;margin-top:8px;font-size:13.5px}\n.a-sumbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ECEDEF;padding:12px 16px 108px;z-index:14;font-size:14px}\n.a-sumbar .r{display:flex;justify-content:space-between;padding:2px 0;color:#4B5563}\n.a-sumbar .r b{color:#111}\n.a-sumbar .abtn{margin-top:10px}\n\n/* app sheet */\n.aovl{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end}\n.sheet{background:#fff;width:100%;height:92%;border-radius:30px 30px 0 0;display:flex;flex-direction:column;animation:slup .28s ease-out}\n.sheet-b{flex:1;overflow:auto;padding:18px 16px 10px}\n.sheet-f{padding:10px 16px 26px;border-top:1px solid #F0F1F3}\n.sheet .choice{border-radius:16px}\n.sheet .choice.on{border-color:var(--app);box-shadow:inset 0 0 0 1px var(--app)}\n.sheet .btn-full{height:54px;border-radius:30px;background:var(--app)}\n.sheet .btn-full[disabled]{background:#FFB9A4}\n.sheet .consent a{color:var(--app)}\n.grab{width:44px;height:5px;background:#D5D7DB;border-radius:9px;margin:10px auto 0}\n.ios-alert{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:35;display:grid;place-items:center}\n.ios-alert div{width:270px;background:rgba(245,245,247,.97);border-radius:14px;text-align:center;overflow:hidden}\n.ios-alert p{margin:0;padding:18px 16px 16px;font-size:14px;line-height:1.35}\n.ios-alert p b{display:block;font-size:16px;margin-bottom:4px}\n.ios-alert button{display:block;width:100%;border:0;border-top:1px solid #D1D1D6;background:none;height:44px;color:#0A84FF;font-size:16px}\n.ios-alert button + button{font-weight:600}\n\n/* home screen */\n.home{min-height:100%;background:linear-gradient(180deg,#3E8FD6,#5AA7E6 50%,#7CB9EB);padding:10px 22px;color:#fff}\n.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 14px;margin-top:20px}\n.hgrid div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:500}\n.hgrid i{display:block;width:62px;height:62px;border-radius:14px}\n.hgrid .gb{position:relative}\n.hgrid .gb::after{content:\"\";position:absolute;left:-2px;bottom:18px;width:8px;height:8px;border-radius:50%;background:#FFD43B}\n.dock{position:absolute;left:14px;right:14px;bottom:24px;height:90px;border-radius:32px;background:rgba(255,255,255,.28);display:flex;justify-content:space-around;align-items:center}\n.dock i{display:block;width:62px;height:62px;border-radius:14px;background:rgba(255,255,255,.55)}\n.home .lab{background:rgba(0,0,0,.35);border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:26px;line-height:1.45}\n<\/style>\n<\/head>\n<body>\n<div class=\"tb\" id=\"tb\"><\/div>\n<div class=\"stage\" id=\"stage\"><\/div>\n\n<script>\n/* ================== STATE ================== */\nconst S = {\n  platform:'web',\n  screen:{web:'plus', mweb:'plus', app:'promo'},\n  status:'inactive',      // inactive | active | cancelled | failed\n  fresh:false,            // práve zakúpené (nový člen)\n  bannerClosed:false, gbInCart:false, ship:null,\n  cancelOpen:false, instantDone:false, ic:'solo', pm:'card', consent:false,\n  icon:'classic', iconAlert:false, faq:{}, toast:''\n};\nconst SCREENS = {\n  web:[['plus','Účet → GymBeam+'],['checkout','Checkout – krok doručenie'],['instant','Instant checkout GymBeam+'],['terms','Obchodné podmienky GymBeam+']],\n  app:[['promo','Promo screen (launch)'],['menu','Účet – menu'],['plus','GymBeam+ v účte'],['icon','Prémiová ikona – plocha'],['checkout','Pokladňa – doručenie'],['instant','Instant checkout']]\n};\nconst STATUS = {inactive:'Neaktívne', active:'Aktívne', cancelled:'Aktívne – obnovenie zrušené', failed:'Neúspešná platba pri obnovení'};\nconst P = {price:'9,90 €', box:'1,49 €', until:'28. 9. 2027', cart:15.03};\nconst eur = n => n.toFixed(2).replace('.',',')+' €';\nconst key = () => S.platform==='mweb' ? 'web' : S.platform;\nconst cur = () => S.screen[S.platform];\nconst isMember = () => S.status==='active' || S.status==='cancelled';\nconst boxFree = () => isMember() || S.gbInCart;\n\n/* ================== ICONS ================== */\nconst IC = {\n  user:'<circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"/>',\n  heart:'<path d=\"M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z\"/>',\n  basket:'<path d=\"M3 9h18l-2 11H5z\"/><path d=\"M8 9l4-6 4 6M9 13v4M15 13v4\"/>',\n  search:'<circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"M20 20l-4-4\"/>',\n  check:'<path d=\"M5 12.5l4.5 4.5L19 7\"/>',\n  x:'<path d=\"M6 6l12 12M18 6L6 18\"/>',\n  chev:'<path d=\"M9 6l6 6-6 6\"/>',\n  back:'<path d=\"M15 5l-7 7 7 7\"/>',\n  lock:'<rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>',\n  box:'<path d=\"M3 7.5l9-4.5 9 4.5v9L12 21l-9-4.5z\"/><path d=\"M3 7.5l9 4.5 9-4.5M12 12v9\"/>',\n  card:'<rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 10h18M7 15h4\"/>',\n  truck:'<path d=\"M2 6h12v10H2zM14 10h4l3 3v3h-7\"/><circle cx=\"6.5\" cy=\"17.5\" r=\"1.8\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"1.8\"/>',\n  refresh:'<path d=\"M20 11a8 8 0 0 0-14.5-4.5L4 8M4 13a8 8 0 0 0 14.5 4.5L20 16\"/><path d=\"M4 4v4h4M20 20v-4h-4\"/>',\n  info:'<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v6M12 7.6v.4\"/>',\n  bell:'<path d=\"M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z\"/><path d=\"M10 21h4\"/>',\n  mail:'<rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/>',\n  cal:'<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M3 10h18M8 3v4M16 3v4\"/>',\n  receipt:'<path d=\"M6 3h12v18l-3-2-3 2-3-2-3 2z\"/><path d=\"M9 8h6M9 12h6\"/>',\n  menu:'<path d=\"M4 7h16M4 12h16M4 17h16\"/>',\n  alert:'<path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v5M12 18v.3\"/>',\n  pkg:'<path d=\"M3 7.5l9-4.5 9 4.5v9L12 21l-9-4.5z\"/><path d=\"M3 7.5l9 4.5 9-4.5\"/>',\n  ret:'<path d=\"M9 14l-5-5 5-5\"/><path d=\"M4 9h11a5 5 0 0 1 0 10h-3\"/>',\n  pin:'<path d=\"M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z\"/><circle cx=\"12\" cy=\"9\" r=\"2.5\"/>',\n  gift:'<rect x=\"3\" y=\"8\" width=\"18\" height=\"5\"/><path d=\"M5 13v8h14v-8M12 8v13M12 8S10 3 7.5 4 8 8 12 8zm0 0s2-5 4.5-4S16 8 12 8z\"/>',\n  grid:'<rect x=\"4\" y=\"4\" width=\"7\" height=\"7\" rx=\"1.5\" fill=\"currentColor\"/><rect x=\"13\" y=\"4\" width=\"7\" height=\"7\" rx=\"1.5\" fill=\"currentColor\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"7\" rx=\"1.5\" fill=\"currentColor\"/><rect x=\"13\" y=\"13\" width=\"7\" height=\"7\" rx=\"1.5\" fill=\"currentColor\"/>',\n  cart:'<path d=\"M3 4h2l2.5 11h11L21 7H6.5\" /><circle cx=\"9\" cy=\"19\" r=\"1.6\" fill=\"currentColor\"/><circle cx=\"17\" cy=\"19\" r=\"1.6\" fill=\"currentColor\"/>'\n};\nconst ic = (n,s=20,w=1.8) => `<svg class=\"i\" width=\"${s}\" height=\"${s}\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"${w}\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">${IC[n]}<\/svg>`;\n\nlet gid=0;\nfunction gSvg(fill){\n  const id='gg'+(gid++);\n  const def = fill==='grad' ? `<defs><linearGradient id=\"${id}\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FFA633\"/><stop offset=\"1\" stop-color=\"#FF4410\"/><\/linearGradient><\/defs>` : '';\n  const f = fill==='grad' ? `url(#${id})` : fill;\n  return `<svg viewBox=\"0 0 100 100\">${def}<text x=\"55\" y=\"75\" text-anchor=\"middle\" font-family=\"Inter, Arial, sans-serif\" font-weight=\"900\" font-style=\"italic\" font-size=\"76\" fill=\"${f}\">G<\/text><path d=\"M6 49 H46 L43.5 56 H3.5 Z\" fill=\"${f}\"/><\/svg>`;\n}\nconst ICONS = {\n  classic:{n:'Klasická', bg:'#000', g:'#fff'},\n  plus:{n:'Orange+', bg:'#000', g:'grad', p:'#FF6840'},\n  inverse:{n:'Inverse+', bg:'linear-gradient(145deg,#FFA633,#FF4410)', g:'#000', p:'#fff'},\n  carbon:{n:'Carbon+', bg:'radial-gradient(circle at 30% 20%,#444,#000 70%)', g:'#fff', p:'#FF4410', ring:true}\n};\nfunction appIcon(v,size){\n  const o=ICONS[v];\n  const ring = o.ring ? `box-shadow:inset 0 0 0 ${Math.max(2,Math.round(size*.05))}px #FF4410;` : '';\n  return `<span class=\"aicon\" style=\"width:${size}px;height:${size}px;background:${o.bg};${ring}\">${gSvg(o.g)}${o.p?`<b style=\"color:${o.p};font-size:${Math.round(size*.36)}px\">+<\/b>`:''}<\/span>`;\n}\nconst wm = (cls='') => `<span class=\"wm ${cls}\">GymBeam<b>+<\/b><\/span>`;\nconst lines = `<svg class=\"mc-lines\" viewBox=\"0 0 320 200\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><g stroke=\"#FF4410\" stroke-width=\"2\" opacity=\".55\"><path d=\"M170 200 L300 20\"/><path d=\"M200 200 L320 40\" opacity=\".6\"/><path d=\"M230 200 L330 70\" opacity=\".35\"/><\/g><\/svg>`;\nfunction mcard(on){\n  if(!on) return `<div class=\"mcard off\"><div class=\"mc-top\">${wm()}<\/div><div class=\"mc-mid\">Tu bude vaša členská karta<\/div><div class=\"mc-bot\"><span>Yevhenii Malovanyi<\/span><\/div><\/div>`;\n  const chip = {active:'Aktívne',cancelled:'Bez obnovenia',failed:'Čaká na platbu'}[S.status]||'Aktívne';\n  const paused = S.status==='failed';\n  return `<div class=\"mcard ${paused?'paused':''}\">${lines}<div class=\"mc-top\">${wm('light')}<span class=\"mc-chip\">${chip}<\/span><\/div><div class=\"mc-name\">Yevhenii Malovanyi<\/div><div class=\"mc-bot\"><div><small>Člen od<\/small>${S.fresh?'09/2026':'09/2025'}<\/div><div><small>${paused?'Stav':'Platí do'}<\/small>${paused?'Pozastavené':P.until}<\/div><\/div><\/div>`;\n}\n\n/* ================== CONTENT DATA ================== */\nconst FAQ = [\n  ['Čo je GymBeam+?','Ročné predplatné, s ktorým máte dopravu do GymBeam Boxu zadarmo pri každej objednávke – bez ohľadu na jej hodnotu.'],\n  ['Na ktoré doručenie sa doprava zadarmo vzťahuje?','Na doručenie do GymBeam Boxov – našich vlastných výdajných boxov na Slovensku, v Česku a Maďarsku. Pri ostatných spôsoboch doručenia platíte bežnú cenu.'],\n  ['Koľko GymBeam+ stojí?','9,90 € na rok. Presnú sumu vidíte pred zaplatením aj v pripomienkovom e-maile pred každým obnovením.'],\n  ['Ako funguje automatické obnovenie?','Rok od aktivácie vám predplatné automaticky strhneme z uloženej platobnej karty. 7 dní vopred vám pošleme e-mail so sumou a dátumom platby.'],\n  ['Ako predplatné zruším?','V účte v sekcii GymBeam+ kliknite na „Zrušiť obnovenie“, prípadne cez odkaz v pripomienkovom e-maile. GymBeam+ vám zostane aktívne do konca zaplateného obdobia.'],\n  ['Čo sa stane, ak platba pri obnovení neprejde?','Predplatné sa neobnoví a pošleme vám e-mail s odkazom na zaplatenie. Po úhrade vám GymBeam+ znova aktivujeme.'],\n  ['Platí doprava zadarmo už pri objednávke, v ktorej si GymBeam+ kupujem?','Áno. Ak si GymBeam+ pridáte do objednávky a vyberiete GymBeam Box, doprava v tejto objednávke je už zadarmo.'],\n  ['Ako môžem GymBeam+ zaplatiť?','Platobnou kartou, Apple Pay alebo Google Pay. Kvôli automatickému obnoveniu nie je možné platiť na dobierku ani výplatnou páskou.'],\n  ['Platí GymBeam+ aj v inej krajine?','Predplatné platí v krajine, v ktorej ste ho kúpili – napríklad GymBeam+ z gymbeam.sk platí pre objednávky na gymbeam.sk.'],\n  ['Môžem od predplatného odstúpiť?','Áno, do 14 dní od aktivácie bez udania dôvodu. Ak ste už dopravu zadarmo využili, vrátime vám sumu zníženú o hodnotu využitých doručení.']\n];\nconst STEPS = [\n  ['Aktivujete GymBeam+','V účte alebo v pokladni, jedným kliknutím.'],\n  ['Vyberiete GymBeam Box','Pri každej objednávke v kroku doručenie.'],\n  ['Za dopravu neplatíte','Bez ohľadu na hodnotu objednávky.'],\n  ['Po roku sa obnoví','7 dní vopred vám pošleme pripomienku.']\n];\nconst COV = [\n  [1,'GymBeam Box (SK, CZ, HU)','Zadarmo'],\n  [0,'Zuply boxy','Bežná cena'],\n  [0,'Kuriér na adresu','Bežná cena'],\n  [0,'Výdajné miesta (Packeta, Balíkovo…)','Bežná cena'],\n  [0,'Boxy iných prevádzkovateľov','Bežná cena']\n];\nconst HIST = () => {\n  if(S.fresh) return [['28. 9. 2026','Aktivácia – ročné predplatné','9,90 €',1]];\n  const first = S.status==='failed' ? ['28. 9. 2026','Obnovenie – ročné predplatné','9,90 €',0] : ['28. 9. 2026','Obnovenie – ročné predplatné','9,90 €',1];\n  return [first,['28. 9. 2025','Aktivácia – ročné predplatné','9,90 €',1]];\n};\nconst SAV = () => S.fresh ? {tot:'0,00 €',n:0,pct:0,txt:'Vaše prvé doručenie do GymBeam Boxu je už zadarmo.'} : {tot:'14,90 €',n:10,pct:90,txt:'8,94 € z 9,90 € – ešte 1 doručenie a predplatné sa vám tento rok vráti.'};\n\nfunction saveViz(tone){\n  const paid=20.86, gb=9.90, pct=Math.round(gb/paid*100);\n  return `<div class=\"sv ${tone}\">\n    <div class=\"sv-head\"><small>Za posledných 12 mesiacov<\/small><strong>−10,96 €<\/strong><span>Toľko by ste ušetrili s GymBeam+ na doručení do GymBeam Boxu.<\/span><\/div>\n    <div class=\"sv-rows\">\n      <div><div class=\"sv-lab\"><span>Zaplatili ste za doručenie<\/span><small>14 objednávok × 1,49 €<\/small><\/div><div class=\"sv-bar\"><i class=\"paid\" style=\"width:100%\">20,86 €<\/i><\/div><\/div>\n      <div><div class=\"sv-lab\"><span>S GymBeam+ by ste zaplatili<\/span><small>1 ročná platba<\/small><\/div><div class=\"sv-bar\"><i class=\"gbp\" style=\"width:${pct}%\">9,90 €<\/i><i class=\"save\" style=\"width:${100-pct}%\">ušetríte<\/i><\/div><\/div>\n      <div class=\"sv-foot\">Vypočítané z vašich objednávok do GymBeam Boxu.<\/div>\n    <\/div><\/div>`;\n}\nconst lockerCard = () => `<div class=\"lk\"><span class=\"lk-ic\">${ic('box',28,2)}<\/span><div><b>Doručenie do GymBeam Boxov<\/b><p>Doprava zadarmo platí pri doručení do našich vlastných výdajných boxov. V pokladni stačí vybrať GymBeam Box a za dopravu neplatíte nič – bez ohľadu na hodnotu objednávky.<\/p><div class=\"lk-ch\"><span>Slovensko<\/span><span>Česko<\/span><span>Maďarsko<\/span><button class=\"lnk\" data-a=\"toast\" data-v=\"Otvorí sa mapa GymBeam Boxov\">Nájsť najbližší box<\/button><\/div><\/div><\/div>`;\nconst faqList = () => FAQ.map((f,i)=>`<div class=\"faq ${S.faq[i]?'open':''}\"><button data-a=\"faq\" data-v=\"${i}\" aria-expanded=\"${!!S.faq[i]}\">${f[0]} ${ic('chev',18)}<\/button>${S.faq[i]?`<p>${f[1]}<\/p>`:''}<\/div>`).join('');\n\n/* ================== WEB ================== */\nfunction webHeader(){\n  return `<div class=\"wh\"><div class=\"wh-top\"><button class=\"burger\" aria-label=\"Menu\">${ic('menu',24)}<\/button><div class=\"logo\">GymBeam<sup>®<\/sup><\/div><div class=\"search\">${ic('search',18)} Hľadajte v obchode...<\/div><div class=\"wh-user\"><span class=\"uname\">Yevhenii Malovanyi<\/span>${ic('user',24)}${ic('heart',24)}${ic('basket',26)}<\/div><\/div>\n  <div class=\"wh-msearch\">${ic('search',18)} Hľadajte v obchode...<\/div>\n  <nav class=\"wh-nav\"><span>POTRAVINY<\/span><span>PROTEÍNY<\/span><span>ŠPORTOVÁ VÝŽIVA<\/span><span>OBLEČENIE<\/span><span>PRÍSLUŠENSTVO<\/span><span>TOP PONUKY<\/span><\/nav><\/div>`;\n}\nconst webFoot = () => `<div class=\"wfoot\"><span>© GymBeam<\/span><span>Obchodné podmienky · Ochrana osobných údajov · <a data-a=\"terms\" style=\"cursor:pointer;color:#fff\">Obchodné podmienky GymBeam+<\/a><\/span><\/div>`;\nfunction accLayout(inner){\n  const items=['Účet','Objednávky','Vrátenia','Predplatné','GymBeam+','Zoznam adries','Informácie o účte','Výsledky DNA testov','Uložené metódy platby','Darčekový poukaz','Recenzie produktov','Odber noviniek','Rýchle objednávanie','Notifikácia o dostupnosti'];\n  return `<div class=\"acc\"><aside class=\"acc-side\">${items.map(t=>t==='GymBeam+'?`<a class=\"on\" href=\"#\">GymBeam+ <span class=\"new\">NOVÉ<\/span><\/a>`:`<a href=\"#\">${t}<\/a>`).join('')}<\/aside><main><div class=\"acc-back\">‹ Späť do účtu<\/div>${inner}<\/main><\/div>`;\n}\nconst covTable = () => `<table class=\"cov\">${COV.map(c=>`<tr><td><span class=\"dot ${c[0]?'y':'n'}\">${ic(c[0]?'check':'x',14,2.4)}<\/span>${c[1]}<\/td><td class=\"${c[0]?'yes':'no'}\">${c[2]}<\/td><\/tr>`).join('')}<\/table>`;\nconst termsFoot = () => `<div class=\"terms-foot\"><span>Predplatné sa ria iv>`,\n    active: S.fresh?`<div class=\"notice green\">${ic('check',20)}<div><b>Vitajte v GymBeam+<\/b>Doprava do GymBeam Boxu je odteraz zadarmo. Potvrdenie a faktúru sme vám poslali na e-mail.<\/div><\/div>`:''\n  }[S.status]||'';\n  const stateRow = {\n    active:`<span class=\"st-dot\" style=\"background:var(--green)\"><\/span>Aktívne`,\n    cancelled:`<span class=\"st-dot\" style=\"background:#F59E0B\"><\/span>Aktívne – bez obnovenia`,\n    failed:`<span class=\"st-dot\" style=\"background:var(--red)\"><\/span>Neaktívne – čaká na platbu`\n  }[S.status];\n  const next = {\n    active:`9,90 € – ${P.until} (automaticky)`,\n    cancelled:`Žiadna – obnovenie ste zrušili`,\n    failed:`9,90 € – čaká na úhradu`\n  }[S.status];\n  const acts = {\n    active:`<button class=\"btn-out\" data-a=\"toast\" data-v=\"Otvorí sa zmena platobnej metódy (Adyen)\">ZMENIŤ PLATOBNÚ METÓDU<\/button><button class=\"btn-out\" data-a=\"cancelOpen\">ZRUŠIŤ OBNOVENIE<\/button>`,\n    cancelled:`<button class=\"btn-pri\" data-a=\"renew\">ZAPNÚŤ OBNOVENIE<\/button>`,\n    failed:`<button class=\"btn-pri\" data-a=\"buy\">ZAPLATIŤ 9,90 €<\/button><button class=\"btn-out\" data-a=\"toast\" data-v=\"Otvorí sa zmena platobnej metódy (Adyen)\">ZMENIŤ PLATOBNÚ METÓDU<\/button>`\n  }[S.status];\n  return head + notice + `\n  <section class=\"member\">\n    <div>${mcard(true)}<\/div>\n    <div class=\"stats\">\n      <div class=\"stat\"><span>Ušetrili ste na doprave<\/span><strong>${sv.tot}<\/strong><small>celkovo, od ${S.fresh?'09/2026':'09/2025'}<\/small><\/div>\n      <div class=\"stat\"><span>Doručení zadarmo<\/span><strong>${sv.n}<\/strong><small>do GymBeam Boxu<\/small><\/div>\n      <div class=\"stat wide\"><span>Aktuálne obdobie<\/span><div class=\"prog\"><i style=\"width:${sv.pct}%\"><\/i><\/div><small>${sv.txt}<\/small><\/div>\n    <\/div>\n  <\/section>\n  <div class=\"barh\">Predplatné<\/div>\n  <div class=\"box\"><dl class=\"dl\">\n    <dt>Stav<\/dt><dd>${stateRow}<\/dd>\n    <dt>${S.status==='failed'?'Platnosť skončila':'Platí do'}<\/dt><dd>${S.status==='failed'?'28. 9. 2026':P.until}<\/dd>\n    <dt>Ďalšia platba<\/dt><dd>${next}<\/dd>\n    <dt>Platobná metóda<\/dt><dd>Visa •••• 4417<\/dd>\n  <\/dl><div class=\"acts\">${acts}<\/div><\/div>\n  <div class=\"barh\">História platieb<\/div>\n  <div class=\"box\"><table class=\"hist\"><thead><tr><th>Dátum<\/th><th>Popis<\/th><th>Suma<\/th><th><\/th><\/tr><\/thead><tbody>\n  ${HIST().map(r=>`<tr><td>${r[0]}<\/td><td>${r[1]}<\/td><td>${r[2]}<\/td><td style=\"text-align:right\">${r[3]?'<span class=\"pill ok\">Zaplatené<\/span> <button class=\"lnk\" data-a=\"toast\" data-v=\"Stiahne sa faktúra (PDF)\">Faktúra<\/button>':'<span class=\"pill bad\">Neúspešná<\/span>'}<\/td><\/tr>`).join('')}\n  <\/tbody><\/table><\/div>\n  <div class=\"barh\">Kde doprava zadarmo platí<\/div><div class=\"box\">${lockerCard()}<\/div>\n  <div class=\"barh\">Časté otázky<\/div><div class=\"box\" style=\"padding-top:4px;padding-bottom:4px\">${faqList()}<\/div>\n  ${termsFoot()}`;\n}\n\nfunction checkoutWeb(){\n  const bf = boxFree();\n  const banner = (!isMember() && !S.bannerClosed && !S.gbInCart) ? `\n    <div class=\"gbb\">${appIcon('plus',44)}<div class=\"gbb-txt\"><b>Doprava do GymBeam Boxu zadarmo na celý rok<\/b><span>Pridajte si GymBeam+ za 9,90 € / rok a už v tejto objednávke neplatíte 1,49 € za doručenie.<\/span><a data-a=\"goPlus\">Ako to funguje<\/a><\/div><button class=\"btn-dark\" data-a=\"addGb\">PRIDAŤ ZA 9,90 €<\/button><button class=\"x\" data-a=\"bannerClose\" aria-label=\"Zavrieť\">${ic('x',16)}<\/button><\/div>` :\n    (S.gbInCart ? `<div class=\"gbb in\">${ic('check',22,2.2)}<div class=\"gbb-txt\"><b>GymBeam+ je v objednávke<\/b><span>Doprava do GymBeam Boxu je v tejto objednávke zadarmo. Predplatné sa aktivuje po zaplatení objednávky.<\/span><\/div><button class=\"lnk\" data-a=\"removeGb\" style=\"color:#2F5E17\">Odobrať<\/button><\/div>` : '');\n  const boxPr = bf ? `<span class=\"pr free\"><s>${P.box}<\/s>Zadarmo<\/span>` : `<span class=\"pr\">${P.box}<\/span>`;\n  const boxHint = bf ? `<span class=\"hint\"><span class=\"gbchip\">GymBeam<b>+<\/b><\/span> doprava zadarmo<\/span>` : (S.bannerClosed ? `<span class=\"hint\">S <a data-a=\"goPlus\">GymBeam+<\/a> zadarmo<\/span>` : '');\n  const opt = (id,lg,col,name,pr,dt,hint='') => `<div class=\"opt ${S.ship===id?'sel':''}\" data-a=\"ship\" data-v=\"${id}\"><span class=\"rad\"><\/span><span class=\"lg\" style=\"background:${col}\">${lg}<\/span><span>${name}${hint}<\/span>${pr}<span class=\"dt\">${dt}<\/span><span class=\"inf\">${ic('info',18)}<\/span><\/div>`;\n  const shipPrice = {box:bf?0:1.49, balik:1.99, packeta:1.90, sps:2.40}[S.ship];\n  const gb = S.gbInCart ? 9.90 : 0;\n  const total = P.cart + gb + (shipPrice||0);\n  return `<div class=\"co-head\"><div class=\"logo\">GymBeam<sup>®<\/sup><\/div><div class=\"wh-user\">${ic('user',24)}${ic('basket',26)}<\/div><\/div>\n  <div class=\"co-steps\"><span><span class=\"n done\">${ic('check',14,2.6)}<\/span>Košík<\/span><span class=\"ln\"><\/span><span><span class=\"n cur\">2<\/span>Doručenie<\/span><span class=\"ln\"><\/span><span class=\"muted\"><span class=\"n nx\">3<\/span>Platba<\/span><\/div>\n  <div class=\"co\"><div>\n    <h2>Doručenie <small>1 položka<\/small><\/h2>\n    <div class=\"cbox\"><h3>Adresa doručenia<\/h3><div style=\"font-weight:600;margin-bottom:10px\">Moje adresy<\/div><div class=\"addr\"><b>Yevhenii Malovanyi<\/b><br>Na Hore 16<br>04022 Kosice<br>Slovensko<\/div><\/div>\n    <div class=\"cbox\" style=\"display:flex;gap:12px;align-items:center\"><span class=\"cbx\"><\/span>Chcem pridať fakturačnú adresu<\/div>\n    <div class=\"cbox\"><h3>Spôsob doručenia<\/h3>\n      ${banner}\n      <div class=\"grp\">Výdajné miesta<\/div>\n      <div class=\"opts\">\n        ${opt('balik','Balíkovo','#F58220','Odberné miesta Balíkovo',`<span class=\"pr\">1,99 €<\/span>`,'utorok 29. 9.')}\n        ${opt('packeta','Packeta','#BA1B02','Doručenie na výdajňu Packeta',`<span class=\"pr\">1,90 €<\/span>`,'utorok 29. 9.')}\n        ${opt('box','BOX','#FF4410','GymBeam Box',boxPr,'pondelok 28. 9.',boxHint)}\n      <\/div>\n      <div class=\"grp\" style=\"margin-top:0\">Doručenie na adresu<\/div>\n      <div class=\"opts\">${opt('sps','SPS','#E30613','Doručenie kuriérom SPS',`<span class=\"pr\">2,40 €<\/span>`,'utorok 29. 9.')}<\/div>\n    <\/div>\n  <\/div>\n  <aside class=\"sum\"><div class=\"cbox\" style=\"display:flex;justify-content:space-between;font-weight:700\"><span>Vaša objednávka (${S.gbInCart?2:1})<\/span><span style=\"color:var(--web);font-weight:500\">Upraviť<\/span><\/div>\n    <div class=\"cbox\"><h3>Zhrnutie objednávky<\/h3>\n      <div class=\"r\"><span>Medzisúčet<\/span><b>15,03 €<\/b><\/div>\n      ${S.gbInCart?`<div class=\"gbl\"><span>${wm()} <span style=\"color:#4B5563\">ročné predplatné<\/span><\/span><b>9,90 €<\/b><\/div>`:''}\n      <div class=\"r\"><span>Doprava<\/span><b>${S.ship?(shipPrice===0?'Zadarmo':eur(shipPrice)):'–'}<\/b><\/div>\n      <div class=\"tot\"><span>Celkom<\/span><span>${eur(total)}<\/span><\/div><div class=\"vat\">vrátane DPH<\/div>\n      <button class=\"btn-green\" style=\"${S.ship?'background:#7CB342':'opacity:.55'}\">POKRAČOVAŤ<\/button>\n      ${S.gbInCart?`<div class=\"note\">GymBeam+ je možné zaplatiť iba kartou, Apple Pay alebo Google Pay – v ďalšom kroku preto nezobrazíme dobierku ani výplatnú pásku.<\/div>`:''}\n    <\/div><\/aside><\/div>`;\n}\n\nfunction instantInner(app){\n  const cls = app ? 'sheet' : 'drawer';\n  if(S.instantDone) return `<div class=\"success\"><div class=\"ok\">${ic('check',32,2.4)}<\/div><h3>GymBeam+ je aktívne<\/h3><p>Doprava do GymBeam Boxu je odteraz zadarmo. Potvrdenie a faktúru sme vám poslali na e-mail.<\/p>${mcard(true)}<button class=\"${app?'abtn':'btn-full'}\" data-a=\"afterPay\">${app?'Prejsť na GymBeam+':'PREJSŤ NA GYMBEAM+'}<\/button><\/div>`;\n  const tot = S.ic==='solo' ? 9.90 : 9.90+P.cart;\n  const choices = `<div class=\"choice ${S.ic==='solo'?'on':''}\" data-a=\"ic\" data-v=\"solo\"><div><b>Len GymBeam+<\/b><small>Samostatná objednávka predplatného<\/small><\/div><strong>9,90 €<\/strong><\/div>\n  <div class=\"choice ${S.ic==='cart'?'on':''}\" data-a=\"ic\" data-v=\"cart\"><div><b>GymBeam+ a váš košík<\/b><small>1 produkt v košíku, doprava do Boxu zadarmo<\/small><\/div><strong>${eur(9.90+P.cart)}<\/strong><\/div>`;\n  const ship = S.ic==='cart' ? `<div class=\"dsec\">Doručenie<\/div><div class=\"prod\">${ic('box',24)}<div><b>GymBeam Box Košice<\/b><small>Na Hore 16 • 04022 Kosice • pondelok 28. 9.<\/small><\/div><span style=\"color:var(--green);font-weight:700\">Zadarmo<\/span><\/div>` : '';\n  const pms = [['card','Visa •••• 4417','Uložená karta'],['wallet', app?'Apple Pay':'Apple Pay / Google Pay',''],['new','Nová platobná karta','']];\n  return `<div class=\"dsec\" style=\"margin-top:0\">Čo kupujete<\/div>${choices}\n  <div class=\"prod\" style=\"margin-top:4px\">${appIcon('plus',48)}<div><b>GymBeam+ ročné predplatné<\/b><small>Doprava do GymBeam Boxu zadarmo na 12 mesiacov<\/small><\/div><b>9,90 €<\/b><\/div>\n  <ul class=\"facts\">\n    <li>${ic('check',18,2.2)}<span>Platí od dnes do ${P.until}<\/span><\/li>\n    <li>${ic('check',18,2.2)}<span>${P.until} sa automaticky obnoví za 9,90 € – 7 dní vopred vám pošleme pripomienku<\/span><\/li>\n    <li>${ic('check',18,2.2)}<span>Obnovenie zrušíte kedykoľvek v účte<\/span><\/li>\n  <\/ul>\n  ${ship}\n  <div class=\"dsec\">Platba<\/div>\n  ${pms.map(p=>`<div class=\"pm ${S.pm===p[0]?'on':''}\" data-a=\"pm\" data-v=\"${p[0]}\"><span class=\"rad\"><\/span>${ic('card',22)}<span>${p[1]} <small>${p[2]}<\/small><\/span><\/div>`).join('')}\n  <div class=\"muted-note\">Kvôli automatickému obnoveniu je možné GymBeam+ zaplatiť iba kartou, Apple Pay alebo Google Pay. Platobnú metódu si bezpečne uložíme u platobnej brány.<\/div>\n  <div class=\"consent\" data-a=\"consent\"><span class=\"cbx ${S.consent?'on':''}\">${S.consent?ic('check',14,3):''}<\/span><span>Súhlasím s <a data-a=\"terms\">Obchodnými podmienkami GymBeam+<\/a> a s tým, že sa predplatné po roku automaticky obnoví a suma 9,90 € sa strhne z mojej platobnej metódy, kým obnovenie nezruším.<\/span><\/div>\n  <!--FOOT-->${eur(tot)}`;\n}\nfunction instantWeb(){\n  let inner = instantInner(false);\n  let foot='';\n  if(!S.instantDone){ const [b,t]=inner.split('<!--FOOT-->'); inner=b; foot=`<div class=\"drawer-f\"><div class=\"ftot\"><span>Celkom<\/span><span>${t}<\/span><\/div><button class=\"btn-full\" data-a=\"pay\" ${S.consent?'':'disabled'}>ZAPLATIŤ ${t}<\/button><\/div>`; }\n  return `<div class=\"ovl\"><div class=\"drawer\" role=\"dialog\" aria-label=\"Aktivovať GymBeam+\"><div class=\"drawer-h\">${S.status==='failed'?'Zaplatiť GymBeam+':'Aktivovať GymBeam+'}<button data-a=\"closeInstant\" aria-label=\"Zavrieť\">${ic('x',22)}<\/button><\/div><div class=\"drawer-b\">${inner}<\/div>${foot}<\/div><\/div>`;\n}\nconst cancelModal = (app) => `<div class=\"${app?'aovl':'ovl center'}\" style=\"${app?'align-items:center;justify-content:center':''}\"><div class=\"modal\" style=\"${app?'border-radius:22px;width:90%':''}\"><h3>Zrušiť automatické obnovenie?<\/h3><p>GymBeam+ vám zostane aktívne do ${P.until}. Potom sa už neobnoví a doprava do GymBeam Boxu bude opäť spoplatnená podľa bežného cenníka.<\/p><div class=\"acts2\">${app?`<button class=\"abtn\" data-a=\"cancelClose\">Ponechať GymBeam+<\/button><button class=\"abtn red\" data-a=\"cancelConfirm\">Zrušiť obnovenie<\/button>`:`<button class=\"btn-out\" data-a=\"cancelConfirm\">ZRUŠIŤ OBNOVENIE<\/button><button class=\"btn-pri\" style=\"height:40px\" data-a=\"cancelClose\">PONECHAŤ GYMBEAM+<\/button>`}<\/div><\/div><\/div>`;\n\nfunction termsBody(){\n  return `<div class=\"terms\">\n  <h1>Obchodné podmienky programu GymBeam+<\/h1>\n  <div class=\"meta\">Platné a účinné od [1. 10. 2026]<\/div>\n  <div class=\"draft\">Návrh textu – pred zverejnením musí schváliť právne oddelenie. Údaje v [hranatých zátvorkách] doplniť.<\/div>\n  <h2>1. Úvodné ustanovenia<\/h2>\n  <ol><li>Tieto obchodné podmienky upravujú program GymBeam+ (ďalej len „predplatné“), ktorý prevádzkuje spoločnosť GymBeam s.r.o., so sídlom [adresa], IČO: [IČO], zapísaná v [register] (ďalej len „predávajúci“).<\/li>\n  <li>Vo veciach, ktoré tieto podmienky neupravujú, sa použijú Všeobecné obchodné podmienky predávajúceho.<\/li><\/ol>\n  <h2>2. Obsah predplatného<\/h2>\n  <ol><li>Počas platnosti predplatného má zákazník dopravu zadarmo pri doručení do GymBeam Boxov prevádzkovaných predávajúcim, a to bez ohľadu na hodnotu objednávky.<\/li>\n  <li>Doprava zadarmo sa nevzťahuje na Zuply boxy, kuriérske doručenie, výdajné miesta a boxy iných prevádzkovateľov. Za tieto spôsoby doručenia platí zákazník cenu podľa aktuálneho cenníka.<\/li>\n  <li>Predplatné platí na tom trhu (e-shope), na ktorom bolo zakúpené, a len pre zákaznícky účet, ku ktorému bolo zakúpené. Predplatné nie je prenosné.<\/li>\n  <li>Ak si zákazník predplatné pridá do objednávky, doprava do GymBeam Boxu je zadarmo už v tejto objednávke.<\/li><\/ol>\n  <h2>3. Cena a platba<\/h2>\n  <ol><li>Cena ročného predplatného je uvedená v zákazníckom účte a pri objednávke vrátane DPH.<\/li>\n  <li>Predplatné je možné uhradiť iba platobnou kartou, Apple Pay alebo Google Pay. Zákazník súhlasí s tým, že jeho platobná metóda bude bezpečne uložená u poskytovateľa platobných služieb na účely automatického obnovenia.<\/li>\n  <li>Predplatné sa aktivuje po pripísaní platby. Doklad o úhrade je dostupný v zákazníckom účte.<\/li><\/ol>\n  <h2>4. Trvanie a automatické obnovenie<\/h2>\n  <ol><li>Predplatné trvá 12 mesiacov odo dňa aktivácie.<\/li>\n  <li>Po uplynutí tohto obdobia sa predplatné automaticky obnoví na ďalších 12 mesiacov a cena sa strhne z uloženej platobnej metódy, ak zákazník obnovenie vopred nezruší.<\/li>\n  <li>Najneskôr 7 dní pred obnovením pošle predávajúci zákazníkovi e-mail so sumou a dátumom platby a s odkazom na zrušenie obnovenia.<\/li>\n  <li>Zmenu ceny oznámi predávajúci zákazníkovi najneskôr 30 dní pred obnovením. Ak zákazník s novou cenou nesúhlasí, môže obnovenie zrušiť.<\/li><\/ol>\n  <h2>5. Zrušenie obnovenia<\/h2>\n  <ol><li>Zákazník môže automatické obnovenie kedykoľvek zrušiť v zákazníckom účte v sekcii GymBeam+ alebo cez odkaz v pripomienkovom e-maile.<\/li>\n  <li>Po zrušení obnovenia zostáva predplatné aktívne do konca zaplateného obdobia. Za nevyčerpanú časť obdobia sa peniaze nevracajú, s výnimkou prípadov podľa článku 6 a 8.<\/li><\/ol>\n  <h2>6. Odstúpenie od zmluvy<\/h2>\n  <ol><li>Zákazník má právo odstúpiť od zmluvy o predplatnom do 14 dní od jej uzavretia bez udania dôvodu.<\/li>\n  <li>Zákazník výslovne žiada, aby sa poskytovanie predplatného začalo pred uplynutím lehoty na odstúpenie. Ak od zmluvy odstúpi, predávajúci mu vráti cenu predplatného zníženú o hodnotu dopravy, ktorú už zákazník využil, podľa bežného cenníka.<\/li><\/ol>\n  <h2>7. Neúspešná platba<\/h2>\n  <ol><li>Ak sa platbu pri obnovení nepodarí strhnúť, predplatné sa neobnoví a zákazník dostane e-mail s odkazom na úhradu.<\/li>\n  <li>Po úhrade cez tento odkaz sa predplatné aktivuje na 12 mesiacov odo dňa úhrady.<\/li><\/ol>\n  <h2>8. Ukončenie zo strany predávajúceho<\/h2>\n  <ol><li>Predávajúci môže predplatné ukončiť, ak ho zákazník zneužíva alebo porušuje tieto podmienky. V takom prípade vráti zákazníkovi pomernú časť ceny za nevyčerpané obdobie.<\/li>\n  <li>Predávajúci môže program GymBeam+ ukončiť s oznámením najmenej 30 dní vopred. Zákazníkovi vráti pomernú časť ceny za nevyčerpané obdobie.<\/li><\/ol>\n  <h2>9. Záverečné ustanovenia<\/h2>\n  <ol><li>Predávajúci môže tieto podmienky meniť. Zmenu oznámi zákazníkovi e-mailom najneskôr 30 dní pred jej účinnosťou.<\/li>\n  <li>Tieto podmienky nadobúdajú platnosť a účinnosť dňom [1. 10. 2026].<\/li><\/ol>\n  <\/div>`;\n}\n\n/* ================== APP ================== */\nconst sbar = (dark) => `<div class=\"sbar\" style=\"color:${dark?'#fff':'#000'}\"><span>10:05<\/span><span cla ázky<\/h3>${faqList()}<\/div>\n    <div class=\"a-terms\"><a data-a=\"terms\">Obchodné podmienky GymBeam+<\/a><\/div>`;\n  } else {\n    const sv=SAV();\n    const notice = {cancelled:`<div class=\"a-notice amber\">${ic('info',20)}<div><b>Obnovenie je zrušené<\/b>GymBeam+ vám platí do ${P.until}.<\/div><\/div>`,failed:`<div class=\"a-notice red\">${ic('alert',20)}<div><b>Platba za obnovenie neprešla<\/b>GymBeam+ je neaktívne. Zaplaťte 9,90 € a znova ho zapneme.<\/div><\/div>`,active:S.fresh?`<div class=\"a-notice\" style=\"background:var(--greenBg);color:#2F5E17\">${ic('check',20)}<div><b>Vitajte v GymBeam+<\/b>Doprava do GymBeam Boxu je odteraz zadarmo.<\/div><\/div>`:''}[S.status]||'';\n    const acts = {active:`<button class=\"abtn ghost\" data-a=\"toast\" data-v=\"Otvorí sa zmena platobnej metódy\">Zmeniť platobnú metódu<\/button><div style=\"height:8px\"><\/div><button class=\"abtn red\" data-a=\"cancelOpen\">Zrušiť obnovenie<\/button>`,cancelled:`<button class=\"abtn\" data-a=\"renew\">Zapnúť obnovenie<\/button>`,failed:`<button class=\"abtn\" data-a=\"buy\">Zaplatiť 9,90 €<\/button>`}[S.status];\n    body = `${notice}<div style=\"padding:4px 0 18px\">${mcard(true)}<\/div>\n    <div class=\"a-stats\"><div class=\"acard\"><small>Ušetrili ste<\/small><strong>${sv.tot}<\/strong><\/div><div class=\"acard\"><small>Doručení zadarmo<\/small><strong>${sv.n}<\/strong><\/div><\/div>\n    <div class=\"acard\"><small style=\"color:var(--mut);font-size:13px\">Aktuálne obdobie<\/small><div class=\"prog\"><i style=\"width:${sv.pct}%\"><\/i><\/div><div style=\"font-size:13px;color:var(--mut)\">${sv.txt}<\/div><\/div>\n    <div class=\"acard\"><h3>Predplatné<\/h3>\n      <div class=\"a-kv\"><span>Stav<\/span><span>${{active:'Aktívne',cancelled:'Bez obnovenia',failed:'Neaktívne'}[S.status]}<\/span><\/div>\n      <div class=\"a-kv\"><span>${S.status==='failed'?'Skončilo':'Platí do'}<\/span><span>${S.status==='failed'?'28. 9. 2026':P.until}<\/span><\/div>\n      <div class=\"a-kv\"><span>Ďalšia platba<\/span><span>${{active:'9,90 € • '+P.until,cancelled:'Žiadna',failed:'Čaká na úhradu'}[S.status]}<\/span><\/div>\n      <div class=\"a-kv\"><span>Platobná metóda<\/span><span>Visa •••• 4417<\/span><\/div>\n      <div style=\"margin-top:12px\">${acts}<\/div><\/div>\n    ${iconPicker()}\n    <div class=\"acard a-hist\"><h3>História platieb<\/h3>${HIST().map(r=>`<div><span>${r[2]}<small>${r[0]}<\/small><\/span><span>${r[3]?'<span class=\"pill ok\">Zaplatené<\/span>':'<span class=\"pill bad\">Neúspešná<\/span>'}<\/span><\/div>`).join('')}<\/div>\n    <div class=\"acard a-faq\"><h3>Časté otázky<\/h3>${faqList()}<\/div>\n    <div class=\"a-terms\"><a data-a=\"terms\">Obchodné podmienky GymBeam+<\/a><\/div>`;\n  }\n  const cta = S.status==='inactive' ? `<div class=\"sticky-cta\"><button class=\"abtn\" data-a=\"buy\" style=\"box-shadow:0 8px 20px rgba(255,68,16,.35)\">Aktivovať za 9,90 € / rok<\/button><\/div>` : '';\n  return `<div class=\"app\">${sbar()}${aHead('GymBeam+')}<div class=\"app-body\">${body}<div style=\"height:${S.status==='inactive'?70:0}px\"><\/div><\/div><\/div><!--FIXED-->${cta}${tabbar('user')}`;\n}\nfunction appHome(){\n  const tiles=['#F4F4F4','#FFD60A','#34C759','#FF9F0A','#5E5CE6','#FF375F','#0A84FF','#8E8E93','#30D158','#64D2FF','#BF5AF2'];\n  const names=['Kalendár','Poznámky','Správy','Hudba','Podcasty','Fotky','Mail','Nastavenia','Mapy','Počasie','Hodiny'];\n  let cells = names.slice(0,6).map((n,i)=>`<div><i style=\"background:${tiles[i]}\"><\/i>${n}<\/div>`).join('');\n  cells += `<div class=\"gb\">${appIcon(S.icon,62)}GymBeam<\/div>`;\n  cells += names.slice(6).map((n,i)=>`<div><i style=\"background:${tiles[i+6]}\"><\/i>${n}<\/div>`).join('');\n  return `<div class=\"home\">${sbar(true)}<div class=\"hgrid\">${cells}<\/div>\n  <div class=\"lab\">Náhľad plochy s ikonou <b>${ICONS[S.icon].n}<\/b>. Ikonu si člen mení v appke v sekcii GymBeam+ → Ikona aplikácie (varianty nájdeš aj vpravo v poznámkach).<\/div>\n  <div class=\"dock\"><i><\/i><i><\/i><i><\/i><i><\/i><\/div><\/div>`;\n}\nfunction appCheckout(){\n  const bf = boxFree();\n  const banner = (!isMember() && !S.bannerClosed && !S.gbInCart) ? `<div class=\"abanner\"><button class=\"x\" data-a=\"bannerClose\" aria-label=\"Zavrieť\">${ic('x',16)}<\/button><div class=\"top\">${appIcon('plus',44)}<div><b>Doprava do Boxu zadarmo celý rok<\/b><small>S GymBeam+ za 9,90 € / rok neplatíte 1,49 € už v tejto objednávke.<\/small><\/div><\/div><button class=\"abtn\" data-a=\"addGb\">Pridať GymBeam+ • 9,90 €<\/button><\/div>` :\n    (S.gbInCart ? `<div class=\"abanner in\"><div class=\"top\">${ic('check',24,2.4)}<div><b>GymBeam+ je v objednávke<\/b><small>Doprava do GymBeam Boxu je v tejto objednávke zadarmo.<\/small><\/div><\/div><button class=\"lnk2\" data-a=\"removeGb\">Odobrať<\/button><\/div>` : '');\n  const opt=(id,lg,col,name,sub,pr)=>`<div class=\"aship ${S.ship===id?'sel':''}\" data-a=\"ship\" data-v=\"${id}\"><span class=\"lg\" style=\"background:${col}\">${lg}<\/span><div><b>${name}<\/b><small>${sub}<\/small><\/div><span class=\"pr ${pr==='Zadarmo'?'free':''}\">${pr}<\/span><\/div>`;\n  const boxPr = bf ? `<span class=\"pr free\"><s>${P.box}<\/s>Zadarmo<\/span>` : P.box;\n  const boxSub = bf ? `pondelok 28. 9. • <span class=\"gbchip\" style=\"margin-left:0\">GymBeam<b>+<\/b><\/span>` : (S.bannerClosed?'pondelok 28. 9. • s GymBeam+ zadarmo':'pondelok 28. 9.');\n  const shipPrice = {box:bf?0:1.49, osobny:0, balik:1.99, packeta:1.90, sps:2.40}[S.ship];\n  const total = P.cart + (S.gbInCart?9.90:0) + (shipPrice||0);\n  return `<div class=\"app\">${sbar()}${aHead('Spôsob doručenia','menu')}<div class=\"app-body\" style=\"padding-bottom:260px\">\n    ${banner}\n    <div style=\"font-weight:700;margin:4px 0 10px\">Výdajné miesta<\/div>\n    <div class=\"aship ${S.ship==='box'?'sel':''}\" data-a=\"ship\" data-v=\"box\"><span class=\"lg\" style=\"background:#FF4410\">BOX<\/span><div><b>GymBeam Box Košice<\/b><small>${boxSub}<\/small><\/div><span class=\"pr ${bf?'free':''}\">${boxPr}<\/span><\/div>\n    ${opt('osobny','GymBeam','#000','Osobný odber Košice','pondelok 28. 9.','Zadarmo')}\n    ${opt('packeta','Packeta','#BA1B02','Výdajňa Packeta','utorok 29. 9.','1,90 €')}\n    ${opt('balik','Balíkovo','#F58220','Odberné miesta Balíkovo','utorok 29. 9.','1,99 €')}\n    <div style=\"font-weight:700;margin:14px 0 10px\">Doručenie na adresu<\/div>\n    ${opt('sps','SPS','#E30613','Kuriér SPS','utorok 29. 9.','2,40 €')}\n  <\/div><\/div><!--FIXED-->\n  <div class=\"a-sumbar\"><div class=\"r\"><span>Košík<\/span><b>15,03 €<\/b><\/div>${S.gbInCart?`<div class=\"r\"><span>GymBeam+ ročné predplatné<\/span><b>9,90 €<\/b><\/div>`:''}<div class=\"r\"><span>Doprava<\/span><b>${S.ship?(shipPrice===0?'Zadarmo':eur(shipPrice)):'–'}<\/b><\/div><div class=\"r\" style=\"font-size:16px;margin-top:4px\"><b>Celkom<\/b><b style=\"color:var(--app)\">${eur(total)}<\/b><\/div><button class=\"abtn\" style=\"${S.ship?'':'opacity:.5'}\">Potvrdiť doručenie<\/button><\/div>\n  ${tabbar('cart')}`;\n}\nfunction instantApp(){\n  let inner = instantInner(true), foot='';\n  if(!S.instantDone){ const [b,t]=inner.split('<!--FOOT-->'); inner=b; foot=`<div class=\"sheet-f\"><div class=\"ftot\"><span>Celkom<\/span><span style=\"color:var(--app)\">${t}<\/span><\/div><button class=\"btn-full\" data-a=\"pay\" ${S.consent?'':'disabled'}>OBJEDNAŤ A ZAPLATIŤ • ${t}<\/button><\/div>`; }\n  return `<div class=\"aovl\"><div class=\"sheet\"><div class=\"grab\"><\/div><div style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 16px 0\"><b style=\"font-size:18px\">${S.status==='failed'?'Zaplatiť GymBeam+':'Aktivovať GymBeam+'}<\/b><button data-a=\"closeInstant\" style=\"border:0;background:none\" aria-label=\"Zavrieť\">${ic('x',22)}<\/button><\/div><div class=\"sheet-b\">${inner}<\/div>${foot}<\/div><\/div>`;\n}\nfunction appTerms(){ return `<div class=\"app\" style=\"background:#fff\">${sbar()}${aHead('Obchodné podmienky','plus')}<div style=\"font-size:14px\">${termsBody().replace('class=\"terms\"','class=\"terms\" style=\"padding:0 16px 40px\"')}<\/div><\/div>`; }\n\n/* ================== NOTES ================== */\nconst NOTES = {\n 'web.plus':`<h4>Účet → GymBeam+<\/h4>\n  <ul><li>Nová položka v ľavom menu <b>GymBeam+<\/b> (badge NOVÉ 30 dní).<\/li><li>Prepni stav vpravo hore: neaktívne / aktívne / zrušené obnovenie / neúspešná platba. Po nákupe cez instant checkout vzniká stav <i>nový člen<\/i> (0 € ušetrené).<\/li><\/ul>\n  <h5>Neaktívne<\/h5><ul><li>Hero s cenou a vizuál úspory: koľko zákazník zaplatil za doručenie do GymBeam Boxu za 12 mesiacov vs. cena GymBeam+. Zobraziť iba ak je úspora &gt; 0, inak blok skryť.<\/li><li>Ako to funguje, kde doprava zadarmo platí (GymBeam Boxy SK/CZ/HU), FAQ, odkaz na OP.<\/li><\/ul>\n  <h5>Aktívne – dashboard<\/h5><ul><li><b>Ušetrili ste<\/b> = súčet bežnej ceny GymBeam Boxu v objednávkach, kde bola doprava zadarmo vďaka GymBeam+ (cena v čase objednávky).<\/li><li><b>Aktuálne obdobie<\/b> = úspora v aktuálnom ročnom období vs. cena predplatného (návratnosť).<\/li><li>Platí do, ďalšia platba, platobná metóda, zrušiť obnovenie (confirm modal), história platieb + faktúra.<\/li><\/ul>\n  <h5>Mobile web<\/h5><ul><li>Rovnaký obsah, menu účtu sa mení na „Späť do účtu“, hero karta ide nad text, tlačidlá na celú šírku.<\/li><\/ul>`,\n 'web.checkout':`<h4>Checkout – krok Doručenie<\/h4>\n  <ul><li>Banner je nad zoznamom spôsobov doručenia, iba pre <b>prihláseného<\/b> zákazníka na SK/CZ/HU bez aktívneho GymBeam+.<\/li><li><b>Pridať<\/b> = pridá GymBeam+ ako virtuálny produkt do košíka, GymBeam Box sa hneď prepočíta na 0 € a predvyberie sa.<\/li><li>V kroku Platba sa pri GymBeam+ v košíku zobrazia iba karta / Apple Pay / Google Pay.<\/li><\/ul>\n  <h5>Zatvorenie ×<\/h5><ul><li>Skryje banner na <b>7 dní<\/b> (uložiť na zákazníka, nie iba do cookie).<\/li><li>Po 3. zatvorení banner už neukazujeme – ostáva iba nenápadný hint pri GymBeam Boxe „S GymBeam+ zadarmo“.<\/li><\/ul>\n  <h5>Člen<\/h5><ul><li>Banner sa nezobrazuje, GymBeam Box má preškrtnutú cenu a štítok GymBeam+.<\/li><\/ul>\n  <p><span class=\"tag\">Pozor<\/span> V aktuálnom screenshote je GymBeam Box <b>zadarmo<\/b> aj bez predplatného. V návrhu som dal placeholder 1,49 € – treba potvrdiť cenník boxu, inak GymBeam+ nemá hodnotu.<\/p>`,\n 'web.instant':`<h4>Instant checkout GymBeam+<\/h4>\n  <ul><li>Vychádza z vášho „Rýchla objednávka“ drawera – na mobile ako bottom sheet.<\/li><li>Dve možnosti: <b>Len GymBeam+<\/b> alebo <b>GymBeam+ + košík<\/b> (doprava do Boxu hneď zadarmo).<\/li><li>Iba tokenizovateľné platby (Adyen – uložená karta, Apple Pay, Google Pay, nová karta).<\/li><li>Povinný checkbox so súhlasom s OP a automatickým obnovením – tlačidlo je dovtedy neaktívne.<\/li><li>Po zaplatení success stav s kartou člena → účet GymBeam+ v stave „nový člen“.<\/li><li>Pri neúspešnej platbe (stav failed) sa rovnaký flow otvára ako „Zaplatiť GymBeam+“.<\/li><\/ul>`,\n 'web.terms':`<h4>Obchodné podmienky GymBeam+<\/h4><ul><li>Samostatná CMS stránka, odkaz z konca stránky GymBeam+, z instant checkoutu (checkbox), z e-mailov a z pätičky webu.<\/li><li>Text je návrh – musí prejsť právnou revíziou (najmä čl. 6 odstúpenie a čl. 4.4 zmena ceny).<\/li><\/ul>`,\n 'app.promo':`<h4>Promo screen po spustení programu<\/h4>\n  <ul><li>Full-screen modal na Home, iba pre prihlásených na SK/CZ/HU bez GymBeam+.<\/li><li>Vizuál úspory (zaplatené vs. s GymBeam+) – iba ak je úspora &gt; 0, inak sa blok nezobrazí.<\/li><\/ul>\n  <h5>Návrh frekvencie<\/h5><ul>\n  <li><b>1. zobrazenie:<\/b> prvé otvorenie appky po spustení, najskôr 3 s po načítaní Home. Nikdy nie pri deeplinku, pushi, v checkoute ani počas onboardingu.<\/li>\n  <li><b>„Teraz nie“ / ×:<\/b> 2. zobrazenie o <b>14 dní<\/b>, 3. o ďalších <b>30 dní<\/b>. Potom už nie – ostáva iba banner v pokladni a vstup v účte.<\/li>\n  <li><b>Kontextový trigger:<\/b> ak zákazník zaplatil za GymBeam Box 3× za 60 dní, môže sa zobraziť skôr, ale min. 7 dní od posledného zatvorenia.<\/li>\n  <li>Limit max. 3× za 6 mesiacov, stav ukladať na BE (cross-device, web aj app).<\/li>\n  <li>Po zakúpení už nikdy. Po expirácii bez obnovenia 1× win-back verzia po 14 dňoch.<\/li><\/ul>`,\n 'app.menu':`<h4>Účet – vstup do GymBeam+<\/h4><ul><li>Čierna karta hneď pod „Vitajte“ – najviditeľnejší vstup, text sa mení podľa stavu (cena / platnosť + úspora / chyba platby).<\/li><li>Ikona v karte zodpovedá zvolenej prémiovej ikone člena.<\/li><\/ul>`,\n 'app.plus':`<h4>GymBeam+ v appke<\/h4><ul><li>Rovnaký obsah ako web, app komponenty (18 px radius, #FF4410, Inter).<\/li><li>Neaktívne: sticky CTA nad tab barom, otvára instant checkout sheet.<\/li><li>Aktívne: dashboard, správa predplatného, výber ikony, história, FAQ, OP.<\/li><li>Nečlen vidí prémiové ikony so zámkom – tap ukáže info a CTA.<\/li><\/ul>\n  <h5>Varianty ikony<\/h5><div class=\"ig\">${'__IG__'}<\/div>`,\n 'app.icon':`<h4>Prémiová ikona<\/h4><ul><li><b>iOS:<\/b> alternate icons v Info.plist + <code>setAlternateIconName<\/code>. iOS zobrazí systémové potvrdenie automaticky.<\/li><li><b>Android:<\/b> activity-alias pre každý variant, prepínanie cez PackageManager (launcher sa môže chvíľu obnovovať).<\/li><li>Po expirácii GymBeam+ sa ikona automaticky vráti na klasickú pri ďalšom spustení.<\/li><\/ul>\n  <h5>Varianty (klikni pre náhľad)<\/h5><div class=\"ig\">${'__IG__'}<\/div><ul><li><b>Orange+<\/b> – čierne pozadie, oranžový G s gradientom, najbližšie k dnešnej ikone.<\/li><li><b>Inverse+<\/b> – oranžové pozadie, najvýraznejšie na ploche.<\/li><li><b>Carbon+<\/b> – tmavý grafit s oranžovým lemom, najprémiovejší dojem.<\/li><\/ul>`,\n 'app.checkout':`<h4>Pokladňa – výber doručenia<\/h4><ul><li>Rovnaká logika ako web: banner s × nad zoznamom, po pridaní sa GymBeam Box prepočíta na 0 €.<\/li><li>GymBeam+ je v súhrne ako samostatný riadok (virtuálny produkt).<\/li><li>× skryje banner na 7 dní, po 3. zatvorení iba hint pri GymBeam Boxe.<\/li><\/ul>`,\n 'app.instant':`<h4>Instant checkout v appke<\/h4><ul><li>Bottom sheet v štýle vášho súčasného „Len tento produkt / Tento produkt + váš košík“.<\/li><li>Na iOS Apple Pay ako predvolená rýchla platba, na Androide Google Pay.<\/li><li>Povinný súhlas s OP a automatickým obnovením.<\/li><\/ul><p><span class=\"tag\">Overiť<\/span> App Store pravidlá: GymBeam+ je výhoda na fyzické doručenie, preto by nemal spadať pod povinné IAP – treba potvrdiť pred releasom.<\/p>`,\n 'app.terms':`<h4>Obchodné podmienky v appke<\/h4><ul><li>Otvárajú sa ako web view rovnakej CMS stránky ako na webe.<\/li><\/ul>`\n};\n\n/* ================== RENDER ================== */\nfunction toolbar(){\n  const k=key();\n  return `<span class=\"tb-brand\">GymBeam<b>+<\/b> návrh<\/span>\n  <div class=\"seg\">${[['web','Web desktop'],['mweb','Web mobile'],['app','App']].map(p=>`<button class=\"${S.platform===p[0]?'on':''}\" data-a=\"plat\" data-v=\"${p[0]}\">${p[1]}<\/button>`).join('')}<\/div>\n  <div class=\"pills\">${SCREENS[k].map(s=>`<button class=\"${cur()===s[0]?'on':''}\" data-a=\"scr\" data-v=\"${s[0]}\">${s[1]}<\/button>`).join('')}<\/div>\n  <div class=\"tb-state\"><label for=\"st\">Stav zákazníka<\/label><select id=\"st\" data-a=\"status\">${Object.entries(STATUS).map(([v,l])=>`<option value=\"${v}\" ${S.status===v?'selected':''}>${l}<\/option>`).join('')}<\/select><button class=\"tb-reset\" data-a=\"reset\">Reset<\/button><\/div>`;\n}\nfunction stage(){\n  const k=key(), sc=cur();\n  let inner='', overlay='';\n  if(k==='web'){\n    if(sc==='plus') inner = webHeader()+accLayout(plusWeb())+webFoot();\n    if(sc==='instant'){ inner = webHeader()+accLayout(plusWeb())+webFoot(); overlay = instantWeb(); }\n    if(sc==='checkout') inner = checkoutWeb();\n    if(sc==='terms') inner = webHeader()+termsBody()+webFoot();\n    if(S.cancelOpen) overlay = cancelModal(false);\n    inner = `<div class=\"web\">${inner}<\/div>`;\n  } else {\n    if(sc==='promo') inner = appPromo();\n    if(sc==='menu') inner = appMenu();\n    if(sc==='plus') inner = appPlus();\n    if(sc==='instant'){ inner = S.instantDone? appPlus() : appPlus(); overlay = instantApp(); }\n    if(sc==='icon') inner = appHome();\n    if(sc==='checkout') inner = appCheckout();\n    if(sc==='terms') inner = appTerms();\n    if(S.cancelOpen) overlay = cancelModal(true);\n    if(S.iconAlert) overlay = `<div class=\"ios-alert\"><div><p><b>Ikona bola zmenená<\/b>Na ploche máte teraz ikonu GymBeam ${ICONS[S.icon].n}.<\/p><button data-a=\"iconOk\">OK<\/button><button data-a=\"iconHome\">Zobraziť plochu<\/button><\/div><\/div>`;\n  }\n  const toast = S.toast ? `<div class=\"toast\">${S.toast}<\/div>` : '';\n  let frame;\n  if(S.platform==='web') frame = `<div class=\"browser\"><div class=\"browser-bar\"><i><\/i><i><\/i><i><\/i><span>gymbeam.sk/${sc==='checkout'?'checkout/#shipping':sc==='terms'?'obchodne-podmienky-gymbeam-plus':'customer/gymbeam-plus'}<\/span><\/div><div class=\"vp-wrap\"><div class=\"viewport\">${inner}<\/div>${overlay}${toast}<\/div><\/div>`;\n  else if(S.platform==='mweb') frame = `<div class=\"phone\"><div class=\"vp-wrap\"><div class=\"mweb-wrap\">${sbar()}<div class=\"urlbar\">gymbeam.sk<\/div><div class=\"viewport\">${inner}<\/div><\/div>${overlay}${toast}<\/div><\/div>`;\n  else { const [body,fixed='']=inner.split('<!--FIXED-->'); frame = `<div class=\"phone\"><div class=\"vp-wrap\"><div class=\"viewport\">${body}<\/div>${fixed}${overlay}${toast}<\/div><\/div>`; }\n  let nk = `${k}.${sc}`;\n  let notes = (NOTES[nk]||'');\n  if(notes.includes('__IG__')) notes = notes.replace('__IG__', Object.keys(ICONS).map(v=>`<button class=\"${S.icon===v?'on':''}\" data-a=\"iconPreview\" data-v=\"${v}\">${appIcon(v,48)}${ICONS[v].n}<\/button>`).join(''));\n  if(S.platform==='mweb') notes = `<p><span class=\"tag\">Mobile web<\/span> Rovnaké komponenty ako desktop, prepínané cez container query (≤ 720 px).<\/p>` + notes;\n  return frame + `<aside class=\"notes\">${notes}<\/aside>`;\n}\nlet lastKey='';\nfunction render(){\n 90 € <span>/ rok<\/span><\/div><button class=\"btn-pri\" data-a=\"buy\">AKTIVOVAŤ GYMBEAM+<\/button><small>Po roku sa automaticky obnoví. Zrušiť môžete kedykoľvek v účte.<\/small><\/div>`;\n}\nconst trio=()=>`<div class=\"trio\"><div><small>Zaplatili ste za doručenie<\/small><b>20,86 €<\/b><\/div><div><small>S GymBeam+ by ste zaplatili<\/small><b>9,90 €<\/b><\/div><div class=\"g\"><small>Ušetrili by ste<\/small><b>10,96 €<\/b><\/div><\/div><div class=\"trio-note\">Za posledných 12 mesiacov, 14 objednávok do GymBeam Boxu.<\/div>`;\nfunction notice(){\n  return {cancelled:`<div class=\"notice amber\">${ic('info')}<div><b>Obnovenie je zrušené<\/b>GymBeam+ platí do ${P.until}, potom sa už neobnoví.<\/div><\/div>`,\n   failed:`<div class=\"notice red\">${ic('alert')}<div><b>Platba za obnovenie neprešla<\/b>GymBeam+ je neaktívne. Zaplaťte 9,90 € a znova ho zapneme.<\/div><\/div>`,\n   active:S.fresh?`<div class=\"notice green\">${ic('check')}<div><b>GymBeam+ je aktívne<\/b>Doprava do GymBeam Boxu je odteraz zadarmo.<\/div><\/div>`:''}[S.status]||'';\n}\nfunction subRows(){\n  const st={active:['var(--green)','Aktívne'],cancelled:['#F59E0B','Aktívne – bez obnovenia'],failed:['var(--red)','Neaktívne']}[S.status];\n  const rows=[['Stav',`<span class=\"st-dot\" style=\"background:${st[0]}\"><\/span>${st[1]}`],[S.status==='failed'?'Skončilo':'Platí do',S.status==='failed'?'28. 9. 2026':P.until],['Ďalšia platba',{active:'9,90 € – '+P.until,cancelled:'Žiadna',failed:'Čaká na úhradu'}[S.status]],['Platobná metóda','Visa •••• 4417']];\n  if(L===2) rows.push(['Ušetrili ste',saved()+' na doprave']);\n  return rows;\n}\nfunction subActs(app){\n  const b=(cls,a,t,web)=>app?`<button class=\"abtn ${cls}\" data-a=\"${a}\">${t}<\/button>`:`<button class=\"${web}\" data-a=\"${a}\">${t.toUpperCase()}<\/button>`;\n  if(S.status==='active') return b('red','cancelOpen','Zrušiť obnovenie','btn-out');\n  if(S.status==='cancelled') return b('','renew','Zapnúť obnovenie','btn-pri');\n  return b('','buy','Zaplatiť 9,90 €','btn-pri');\n}\nfunction plusWeb(){\n  if(S.status==='inactive'){\n    let h=offerCard();\n    if(L===2) h+=trio()+`<div class=\"barh\">Ako to funguje<\/div><div class=\"box\"><ol class=\"steps3\"><li>Aktivujete GymBeam+<\/li><li>V pokladni vyberiete GymBeam Box<\/li><li>Za dopravu neplatíte<\/li><\/ol><\/div>`;\n    return h+`<div class=\"barh\">Časté otázky<\/div><div class=\"box\" style=\"padding-top:4px;padding-bottom:4px\">${faqList()}<\/div>${termsLink()}`;\n  }\n  let h=notice()+`<div class=\"barh\" style=\"margin-top:0\">Vaše predplatné<\/div><div class=\"box\"><dl class=\"dl\">${subRows().map(r=>`<dt>${r[0]}<\/dt><dd>${r[1]}<\/dd>`).join('')}<\/dl><div class=\"acts\">${subActs(false)}<\/div><\/div>`;\n  if(L===2) h+=`<div class=\"barh\">História platieb<\/div><div class=\"box\"><table class=\"hist\"><tr><th>Dátum<\/th><th>Suma<\/th><th><\/th><\/tr>${HIST().map(r=>`<tr><td>${r[0]}<\/td><td>${r[1]}<\/td><td style=\"text-align:right\">${r[2]?'<span class=\"pill ok\">Zaplatené<\/span>':'<span class=\"pill bad\">Neúspešná<\/span>'}<\/td><\/tr>`).join('')}<\/table><\/div>`;\n  return h+`<div class=\"barh\">Časté otázky<\/div><div class=\"box\" style=\"padding-top:4px;padding-bottom:4px\">${faqList()}<\/div>${termsLink()}`;\n}\nfunction checkoutWeb(){\n  const bf=boxFree(), mem=isMember();\n  let promo='';\n  if(L===2 && !mem){\n    if(S.gbInCart) promo=`<div class=\"gbl in\">${ic('check',20,2.2)}<span class=\"t\"><b>GymBeam+ pridané.<\/b> Doprava do GymBeam Boxu je zadarmo.<\/span><button class=\"lnk\" style=\"color:#2F5E17\" data-a=\"removeGb\">Odobrať<\/button><\/div>`;\n    else if(!S.bannerClosed) promo=`<div class=\"gbl\">${sq()}<span class=\"t\"><b>GymBeam+<\/b> – doprava do GymBeam Boxu zadarmo na celý rok za 9,90 €.<\/span><button class=\"btn-dark\" data-a=\"addGb\">PRIDAŤ<\/button><button class=\"x\" data-a=\"bannerClose\" aria-label=\"Zavrieť\">${ic('x',16)}<\/button><\/div>`;\n  }\n  const opt=(id,lg,col,name,pr,dt)=>`<div class=\"opt ${S.ship===id?'sel':''}\" data-a=\"ship\" data-v=\"${id}\"><span class=\"rad\"><\/span><span class=\"lg\" style=\"background:${col}\">${lg}<\/span><span>${name}<\/span>${pr}<span class=\"dt\">${dt}<\/span><\/div>`;\n  const boxPr=bf?`<span class=\"pr free\"><s>${P.box}<\/s>Zadarmo<\/span>`:`<span class=\"pr\">${P.box}<\/span>`;\n  const addon=(L===3&&!mem)?`<div class=\"addon\" data-a=\"toggleGb\"><span class=\"cbx ${S.gbInCart?'on':''}\">${S.gbInCart?ic('check',14,3):''}<\/span><div><b>Pridať GymBeam+ za 9,90 € / rok<\/b><br><span>Doprava do GymBeam Boxu zadarmo teraz aj pri ďalších objednávkach.<\/span><\/div><\/div>`:'';\n  const sp={box:bf?0:1.49,balik:1.99,packeta:1.90,sps:2.40}[S.ship];\n  const tot=P.cart+(S.gbInCart?9.90:0)+(sp||0);\n  return `<div class=\"co-head\"><div class=\"logo\">GymBeam<\/div><div class=\"wh-user\">${ic('user',24)}${ic('basket',26)}<\/div><\/div>\n  <div class=\"co-steps\"><span><span class=\"n done\">${ic('check',14,2.6)}<\/span>Košík<\/span><span class=\"ln\"><\/span><span><span class=\"n cur\">2<\/span>Doručenie<\/span><span class=\"ln\"><\/span><span class=\"muted\"><span class=\"n nx\">3<\/span>Platba<\/span><\/div>\n  <div class=\"co\"><div><h2>Doručenie<\/h2>\n   <div class=\"cbox\"><h3>Adresa doručenia<\/h3><div class=\"addr\"><b>Yevhenii Malovanyi<\/b><br>Na Hore 16<br>04022 Kosice<br>Slovensko<\/div><\/div>\n   <div class=\"cbox\"><h3>Spôsob doručenia<\/h3>${promo}\n    <div class=\"grp\">Výdajné miesta<\/div><div class=\"opts\">\n     ${opt('balik','Balíkovo','#F58220','Odberné miesta Balíkovo','<span class=\"pr\">1,99 €<\/span>','utorok 29. 9.')}\n     ${opt('packeta','Packeta','#BA1B02','Doručenie na výdajňu Packeta','<span class=\"pr\">1,90 €<\/span>','utorok 29. 9.')}\n     ${opt('box','BOX','#FF4410','GymBeam Box',boxPr,'pondelok 28. 9.')}${addon}\n    <\/div>\n    <div class=\"grp\">Doručenie na adresu<\/div><div class=\"opts\">${opt('sps','SPS','#E30613','Doručenie kuriérom SPS','<span class=\"pr\">2,40 €<\/span>','utorok 29. 9.')}<\/div>\n   <\/div><\/div>\n   <aside class=\"sum\"><div class=\"cbox\"><h3>Zhrnutie objednávky<\/h3>\n    <div class=\"r\"><span>Medzisúčet<\/span><b>15,03 €<\/b><\/div>${S.gbInCart?`<div class=\"r\"><span>GymBeam+ ročné predplatné<\/span><b>9,90 €<\/b><\/div>`:''}\n    <div class=\"r\"><span>Doprava<\/span><b>${S.ship?(sp===0?'Zadarmo':eur(sp)):'–'}<\/b><\/div>\n    <div class=\"tot\"><span>Celkom<\/span><span>${eur(tot)}<\/span><\/div>\n    <button class=\"btn-green\" style=\"${S.ship?'':'opacity:.55'}\">POKRAČOVAŤ<\/button>\n    ${S.gbInCart?'<div class=\"note\">GymBeam+ je možné zaplatiť iba kartou, Apple Pay alebo Google Pay.<\/div>':''}\n   <\/div><\/aside><\/div>`;\n}\nfunction instantBody(app){\n  if(S.instantDone) return {b:`<div class=\"success\"><div class=\"ok\">${ic('check',32,2.4)}<\/div><h3>GymBeam+ je aktívne<\/h3><p>Doprava do GymBeam Boxu je odteraz zadarmo. Potvrdenie sme vám poslali na e-mail.<\/p><button class=\"${app?'abtn':'btn-full'}\" data-a=\"afterPay\">${app?'Hotovo':'HOTOVO'}<\/button><\/div>`,f:''};\n  let b=`<div class=\"prod\">${sq()}<div><b>GymBeam+ ročné predplatné<\/b><small>Doprava do GymBeam Boxu zadarmo na 12 mesiacov<\/small><\/div><b>9,90 €<\/b><\/div>`;\n  if(L===2) b+=`<div class=\"line\"><span>Platí do<\/span><span>${P.until}<\/span><\/div><div class=\"line\"><span>Automatické obnovenie<\/span><span>${P.until}, pripomenieme 7 dní vopred<\/span><\/div>`;\n  else b+=`<div class=\"line\"><span>Obnovuje sa automaticky<\/span><span>${P.until}<\/span><\/div>`;\n  b+=`<div class=\"line\"><span>Platba<\/span><span>Visa •••• 4417 <button class=\"lnk\" data-a=\"toast\" data-v=\"Výber karty / Apple Pay / Google Pay\">Zmeniť<\/button><\/span><\/div>`;\n  b+=`<div class=\"consent\" data-a=\"consent\"><span class=\"cbx ${S.consent?'on':''}\">${S.consent?ic('check',14,3):''}<\/span><span>Súhlasím s <a data-a=\"terms\">Obchodnými podmienkami GymBeam+<\/a> a s automatickým obnovením predplatného.<\/span><\/div>`;\n  const f=`<div class=\"ftot\"><span>Celkom<\/span><span style=\"color:${app?'var(--app)':'var(--web)'}\">9,90 €<\/span><\/div><button class=\"btn-full\" data-a=\"pay\" ${S.consent?'':'disabled'}>${app?'Zaplatiť 9,90 €':'ZAPLATIŤ 9,90 €'}<\/button>`;\n  return {b,f};\n}\nfunction instantWeb(){ const x=instantBody(false); return `<div class=\"ovl\"><div class=\"drawer\"><div class=\"drawer-h\">GymBeam+<button data-a=\"closeInstant\">${ic('x',22)}<\/button><\/div><div class=\"drawer-b\">${x.b}<\/div>${x.f?`<div class=\"drawer-f\">${x.f}<\/div>`:''}<\/div><\/div>`; }\nconst cancelModal=(app)=>`<div class=\"${app?'aovl':'ovl center'}\" style=\"${app?'align-items:center;justify-content:center':''}\"><div class=\"modal\" style=\"${app?'border-radius:22px;width:90%':''}\"><h3>Zrušiť obnovenie?<\/h3><p>GymBeam+ vám zostane do ${P.until}. Potom sa už neobnoví.<\/p><div class=\"acts2\">${app?`<button class=\"abtn\" data-a=\"cancelClose\">Ponechať<\/button><button class=\"abtn red\" data-a=\"cancelConfirm\">Zrušiť obnovenie<\/button>`:`<button class=\"btn-out\" data-a=\"cancelConfirm\">ZRUŠIŤ OBNOVENIE<\/button><button class=\"btn-pri\" style=\"height:40px\" data-a=\"cancelClose\">PONECHAŤ<\/button>`}<\/div><\/div><\/div>`;\n\nfunction termsBody(){\n  return `<div class=\"terms\">\n  <h1>Obchodné podmienky programu GymBeam+<\/h1>\n  <div class=\"meta\">Platné a účinné od [1. 10. 2026]<\/div>\n  <div class=\"draft\">Návrh textu – pred zverejnením musí schváliť právne oddelenie. Údaje v [hranatých zátvorkách] doplniť.<\/div>\n  <h2>1. Úvodné ustanovenia<\/h2>\n  <ol><li>Tieto obchodné podmienky upravujú program GymBeam+ (ďalej len „predplatné“), ktorý prevádzkuje spoločnosť GymBeam s.r.o., so sídlom [adresa], IČO: [IČO], zapísaná v [register] (ďalej len „predávajúci“).<\/li>\n  <li>Vo veciach, ktoré tieto podmienky neupravujú, sa použijú Všeobecné obchodné podmienky predávajúceho.<\/li><\/ol>\n  <h2>2. Obsah predplatného<\/h2>\n  <ol><li>Počas platnosti predplatného má zákazník dopravu zadarmo pri doručení do GymBeam Boxov prevádzkovaných predávajúcim, a to bez ohľadu na hodnotu objednávky.<\/li>\n  <li>Doprava zadarmo sa nevzťahuje na Zuply boxy, kuriérske doručenie, výdajné miesta a boxy iných prevádzkovateľov. Za tieto spôsoby doručenia platí zákazník cenu podľa aktuálneho cenníka.<\/li>\n  <li>Predplatné platí na tom trhu (e-shope), na ktorom bolo zakúpené, a len pre zákaznícky účet, ku ktorému bolo zakúpené. Predplatné nie je prenosné.<\/li>\n  <li>Ak si zákazník predplatné pridá do objednávky, doprava do GymBeam Boxu je zadarmo už v tejto objednávke.<\/li><\/ol>\n  <h2>3. Cena a platba<\/h2>\n  <ol><li>Cena ročného predplatného je uvedená v zákazníckom účte a pri objednávke vrátane DPH.<\/li>\n  <li>Predplatné je možné uhradiť iba platobnou kartou, Apple Pay alebo Google Pay. Zákazník súhlasí s tým, že jeho platobná metóda bude bezpečne uložená u poskytovateľa platobných služieb na účely automatického obnovenia.<\/li>\n  <li>Predplatné sa aktivuje po pripísaní platby. Doklad o úhrade je dostupný v zákazníckom účte.<\/li><\/ol>\n  <h2>4. Trvanie a automatické obnovenie<\/h2>\n  <ol><li>Predplatné trvá 12 mesiacov odo dňa aktivácie.<\/li>\n  <li>Po uplynutí tohto obdobia sa predplatné automaticky obnoví na ďalších 12 mesiacov a cena sa strhne z uloženej platobnej metódy, ak zákazník obnovenie vopred nezruší.<\/li>\n  <li>Najneskôr 7 dní pred obnovením pošle predávajúci zákazníkovi e-mail so sumou a dátumom platby a s odkazom na zrušenie obnovenia.<\/li>\n  <li>Zmenu ceny oznámi predávajúci zákazníkovi najneskôr 30 dní pred obnovením. Ak zákazník s novou cenou nesúhlasí, môže obnovenie zrušiť.<\/li><\/ol>\n  <h2>5. Zrušenie obnovenia<\/h2>\n  <ol><li>Zákazník môže automatické obnovenie kedykoľvek zrušiť v zákazníckom účte v sekcii GymBeam+ alebo cez odkaz v pripomienkovom e-maile.<\/li>\n  <li>Po zrušení obnovenia zostáva predplatné aktívne do konca zaplateného obdobia. Za nevyčerpanú časť obdobia sa peniaze nevracajú, s výnimkou prípadov podľa článku 6 a 8.<\/li><\/ol>\n  <h2>6. Odstúpenie od zmluvy<\/h2>\n  <ol><li>Zákazník má právo odstúpiť od zmluvy o predplatnom do 14 dní od jej uzavretia bez udania dôvodu.<\/li>\n  <li>Zákazník výslovne žiada, aby sa poskytovanie predplatného začalo pred uplynutím lehoty na odstúpenie. Ak od zmluvy odstúpi, predávajúci mu vráti cenu predplatného zníženú o hodnotu dopravy, ktorú už zákazník využil, podľa bežného cenníka.<\/li><\/ol>\n  <h2>7. Neúspešná platba<\/h2>\n  <ol><li>Ak sa platbu pri obnovení nepodarí strhnúť, predplatné sa neobnoví a zákazník dostane e-mail s odkazom na úhradu.<\/li>\n  <li>Po úhrade cez tento odkaz sa predplatné aktivuje na 12 mesiacov odo dňa úhrady.<\/li><\/ol>\n  <h2>8. Ukončenie zo strany predávajúceho<\/h2>\n  <ol><li>Predávajúci môže predplatné ukončiť, ak ho zákazník zneužíva alebo porušuje tieto podmienky. V takom prípade vráti zákazníkovi pomernú časť ceny za nevyčerpané obdobie.<\/li>\n  <li>Predávajúci môže program GymBeam+ ukončiť s oznámením najmenej 30 dní vopred. Zákazníkovi vráti pomernú časť ceny za nevyčerpané obdobie.<\/li><\/ol>\n  <h2>9. Záverečné ustanovenia<\/h2>\n  <ol><li>Predávajúci môže tieto podmienky meniť. Zmenu oznámi zákazníkovi e-mailom najneskôr 30 dní pred jej účinnosťou.<\/li>\n  <li>Tieto podmienky nadobúdajú platnosť a účinnosť dňom [1. 10. 2026].<\/li><\/ol>\n  <\/div>`;\n}\n\n\n\n/* ---------- APP ---------- */\nconst sbar=()=>`<div class=\"sbar\"><span>10:05<\/span><span>▮▮▮<\/span><\/div>`;\nconst tabbar=(on)=>`<div class=\"tabbar\"><span class=\"tabG\">G<\/span><span>${ic('grid',26)}<\/span><span class=\"${on==='cart'?'on':''}\">${ic('cart',28,2.2)}<em>1<\/em><\/span><span>${ic('heart',26,2.2)}<\/span><span class=\"${on==='user'?'on':''}\">${ic('user',26,2.2)}<\/span><\/div>`;\nconst aHead=(t,back)=>`<div class=\"a-head\"><button class=\"bk\" data-a=\"go\" data-v=\"${back}\">${ic('back',22,2)}<\/button><h1>${t}<\/h1><\/div>`;\nconst subText=()=>({inactive:'Doprava do GymBeam Boxu zadarmo',active:'Aktívne do '+P.until,cancelled:'Platí do '+P.until+', bez obnovenia',failed:'Platba neprešla'}[S.status]);\nfunction appMenu(){\n  const row=(i,t)=>`<div class=\"arow\">${ic(i,24)}<span>${t}<\/span>${ic('chev',20)}<\/div>`;\n  const top = L===2 ? `<div class=\"gbrow\" data-a=\"go\" data-v=\"plus\">${sq()}<div><b>GymBeam+<\/b><small>${subText()}<\/small><\/div>${ic('chev',20)}<\/div>` : '';\n  const inList = L===3 ? `<div class=\"arow link\" data-a=\"go\" data-v=\"plus\">${ic('refresh',24)}<span>GymBeam+<small>${subText()}<\/small><\/span>${ic('chev',20)}<\/div>` : '';\n  return `<div class=\"app\">${sbar()}<div class=\"app-body\"><div class=\"a-title\">Vitajte, Yevhenii<\/div>${top}\n  <div class=\"acard\"><h3>Nákupy<\/h3>${row('pkg','Objednávky')}${row('refresh','Predplatné')}${inList}${row('ret','Vrátenia')}<\/div>\n  <div class=\"acard\"><h3>Účet<\/h3>${row('bell','Upozornenia')}${row('user','Informácie o účte')}${row('pin','Zoznam adries')}${row('card','Uložené metódy platby')}<\/div><\/div><\/div><!--FIXED-->${tabbar('user')}`;\n}\nfunction appPlus(){\n  let b='', cta='';\n  if(S.status==='inactive'){\n    b=`<div class=\"acard ahero\">${wm()}<h2>Doprava do GymBeam Boxu zadarmo na celý rok<\/h2>${L===2?'<p>Pri každej objednávke, bez ohľadu na jej hodnotu.<\/p>':''}<div class=\"price\">9,90 € <span>/ rok<\/span><\/div><small>Po roku sa automaticky obnoví. Zrušiť môžete kedykoľvek.<\/small>${L===3?'<div style=\"height:14px\"><\/div><button class=\"abtn\" data-a=\"buy\">Aktivovať GymBeam+<\/button>':''}<\/div>`;\n    if(L===2) b+=`<div class=\"acard\"><h3>Za posledných 12 mesiacov<\/h3><div class=\"atrio\"><div><span>Zaplatili ste za doručenie<\/span><b>20,86 €<\/b><\/div><div><span>S GymBeam+ by ste zaplatili<\/span><b>9,90 €<\/b><\/div><div class=\"g\"><span>Ušetrili by ste<\/span><b>10,96 €<\/b><\/div><\/div><\/div>`;\n    if(L===2) cta=`<div class=\"sticky-cta\"><button class=\"abtn\" data-a=\"buy\">Aktivovať za 9,90 € / rok<\/button><\/div>`;\n  } else {\n    const n=notice().replace('class=\"notice ','class=\"a-notice ');\n    b=n+`<div class=\"acard\"><h3>Vaše predplatné<\/h3>${subRows().map(r=>`<div class=\"a-kv\"><span>${r[0]}<\/span><span>${r[1]}<\/span><\/div>`).join('')}<div style=\"margin-top:12px\">${subActs(true)}<\/div><\/div>`;\n    if(L===2) b+=`<div class=\"acard\"><h3>História platieb<\/h3>${HIST().map(r=>`<div class=\"a-kv\"><span>${r[0]}<\/span><span>${r[1]} ${r[2]?'<span class=\"pill ok\">Zaplatené<\/span>':'<span class=\"pill bad\">Neúspešná<\/span>'}<\/span><\/div>`).join('')}<\/div>`;\n  }\n  b+=`<div class=\"acard\"><h3>Časté otázky<\/h3>${faqList()}<\/div>${termsLink(true)}`;\n  return `<div class=\"app\">${sbar()}${aHead('GymBeam+','menu')}<div class=\"app-body\">${b}${cta?'<div style=\"height:70px\"><\/div>':''}<\/div><\/div><!--FIXED-->${cta}${tabbar('user')}`;\n}\nfunction appCheckout(){\n  const bf=boxFree(), mem=isMember();\n  let promo='';\n  if(L===2 && !mem){\n    if(S.gbInCart) promo=`<div class=\"agbl in\">${ic('check',20,2.2)}<span class=\"t\"><b>GymBeam+ pridané.<\/b> Doprava do Boxu zadarmo.<\/span><button class=\"x\" data-a=\"removeGb\" style=\"color:#2F5E17;font-weight:700;text-decoration:underline\">Odobrať<\/button><\/div>`;\n    else if(!S.bannerClosed) promo=`<div class=\"agbl\">${sq()}<span class=\"t\"><b>GymBeam+<\/b><br>Doprava do Boxu zadarmo celý rok za 9,90 €<\/span><button class=\"add\" data-a=\"addGb\">Pridať<\/button><button class=\"x\" data-a=\"bannerClose\">${ic('x',16)}<\/button><\/div>`;\n  }\n  const opt=(id,lg,col,name,sub,pr)=>`<div class=\"aship ${S.ship===id?'sel':''}\" data-a=\"ship\" data-v=\"${id}\"><span class=\"lg\" style=\"background:${col}\">${lg}<\/span><div><b>${name}<\/b><small>${sub}<\/small><\/div><span class=\"pr ${pr==='Zadarmo'?'free':''}\">${pr}<\/span><\/div>`;\n  const boxPr=bf?`<span class=\"pr free\"><s>${P.box}<\/s>Zadarmo<\/span>`:`<span class=\"pr\">${P.box}<\/span>`;\n  const addon=(L===3&&!mem)?`<div class=\"aaddon\" data-a=\"toggleGb\"><span class=\"cbx ${S.gbInCart?'on':''}\">${S.gbInCart?ic('check',14,3):''}<\/span><div><b>Pridať GymBeam+ za 9,90 € / rok<\/b><br><span>Doprava do GymBeam Boxu zadarmo celý rok.<\/span><\/div><\/div>`:'';\n  const sp={box:bf?0:1.49,osobny:0,packeta:1.90,sps:2.40}[S.ship];\n  const tot=P.cart+(S.gbInCart?9.90:0)+(sp||0);\n  return `<div class=\"app\">${sbar()}${aHead('Spôsob doručenia','menu')}<div class=\"app-body\" style=\"padding-bottom:260px\">${promo}\n   <div class=\"aship ${S.ship==='box'?'sel':''}\" data-a=\"ship\" data-v=\"box\"><span class=\"lg\" style=\"background:#FF4410\">BOX<\/span><div><b>GymBeam Box Košice<\/b><small>pondelok 28. 9.<\/small><\/div>${boxPr}<\/div>${addon}\n   ${opt('osobny','GymBeam','#000','Osobný odber Košice','pondelok 28. 9.','Zadarmo')}\n   ${opt('packeta','Packeta','#BA1B02','Výdajňa Packeta','utorok 29. 9.','1,90 €')}\n   ${opt('sps','SPS','#E30613','Kuriér SPS','utorok 29. 9.','2,40 €')}<\/div><\/div><!--FIXED-->\n   <div class=\"a-sumbar\"><div class=\"r\"><span>Košík<\/span><b>15,03 €<\/b><\/div>${S.gbInCart?'<div class=\"r\"><span>GymBeam+<\/span><b>9,90 €<\/b><\/div>':''}<div class=\"r\"><span>Doprava<\/span><b>${S.ship?(sp===0?'Zadarmo':eur(sp)):'–'}<\/b><\/div><div class=\"r\" style=\"font-size:16px\"><b>Celkom<\/b><b style=\"color:var(--app)\">${eur(tot)}<\/b><\/div><button class=\"abtn\" style=\"${S.ship?'':'opacity:.5'}\">Potvrdiť doručenie<\/button><\/div>${tabbar('cart')}`;\n}\nfunction instantApp(){ const x=instantBody(true); return `<div class=\"aovl\"><div class=\"sheet\"><div class=\"grab\"><\/div><div style=\"display:flex;justify-content:space-between;padding:10px 16px 0\"><b style=\"font-size:18px\">GymBeam+<\/b><button data-a=\"closeInstant\" style=\"border:0;background:none\">${ic('x',22)}<\/button><\/div><div class=\"sheet-b\">${x.b}<\/div>${x.f?`<div class=\"sheet-f\">${x.f}<\/div>`:''}<\/div><\/div>`; }\nfunction appTerms(){ return `<div class=\"app\" style=\"background:#fff\">${sbar()}${aHead('Obchodné podmienky','plus')}${termsBody().replace('class=\"terms\"','class=\"terms\" style=\"padding:0 16px 40px\"')}<\/div>`; }\n\n/* ---------- NOTES ---------- */\nconst DIFF = L===2\n ? `<h5>Oproti variantu A chýba<\/h5><ul><li>členská karta, dashboard s progress barom<\/li><li>prémiové ikony appky, promo screen v appke<\/li><li>veľký banner v checkoute (je iba 1-riadkový)<\/li><li>výber „Len GymBeam+ / + košík“ v instant checkoute<\/li><\/ul><h5>Ostáva<\/h5><ul><li>úspora ako 3 čísla, 3 kroky „Ako to funguje“, 6 FAQ<\/li><li>história platieb, „Ušetrili ste“ v predplatnom<\/li><li>1-riadkový banner v checkoute so zatvorením ×<\/li><\/ul>`\n : `<h5>Oproti variantu B chýba<\/h5><ul><li>úspora pre nečlena, „Ako to funguje“<\/li><li>história platieb, „Ušetrili ste“<\/li><li>banner v checkoute – nahradil ho checkbox pod GymBeam Boxom<\/li><li>zvýraznený vstup v appke (GymBeam+ je bežný riadok v Nákupy)<\/li><li>FAQ skrátené na 4 otázky<\/li><\/ul><h5>Ostáva (minimum podľa AC)<\/h5><ul><li>kúpa, stav, platí do, ďalšia platba, zrušenie/obnovenie, platba po neúspešnom autocharge<\/li><li>OP GymBeam+ a súhlas s obnovením<\/li><\/ul>`;\nconst NOTES={\n 'web.plus':`<h4>${VNAME}<\/h4>${DIFF}`,\n 'web.checkout':`<h4>Checkout – doručenie<\/h4>${L===2?'<ul><li>1-riadkový banner nad spôsobmi doručenia, × skryje na 7 dní.<\/li><li>„Pridať“ vloží GymBeam+ do košíka a GymBeam Box prepočíta na 0 €.<\/li><\/ul>':'<ul><li>Žiadny banner. Pod GymBeam Boxom je iba checkbox „Pridať GymBeam+“.<\/li><li>Zaškrtnutie = virtuálny produkt v košíku a Box za 0 €.<\/li><li>Nie je čo zatvárať ani pamätať – najmenej logiky pre devov.<\/li><\/ul>'}`,\n 'web.instant':`<h4>Instant checkout<\/h4><ul><li>Iba GymBeam+ (bez kombinácie s košíkom).<\/li><li>Uložená karta + „Zmeniť“, povinný súhlas s OP a obnovením.<\/li>${L===3?'<li>Namiesto viacerých faktov iba dátum obnovenia.<\/li>':''}<\/ul>`,\n 'web.terms':`<h4>Obchodné podmienky<\/h4><ul><li>Rovnaký text ako vo variante A – právne minimum sa nezjednodušuje.<\/li><\/ul>`,\n 'app.menu':`<h4>Účet – menu<\/h4><ul><li>${L===2?'Samostatný riadok GymBeam+ nad Nákupy (bez čiernej karty).':'GymBeam+ je bežný riadok v sekcii Nákupy.'}<\/li><li>Bez promo screenu a bez prémiovej ikony.<\/li><\/ul>`,\n 'app.plus':`<h4>GymBeam+ v appke<\/h4>${DIFF}`,\n 'app.checkout':`<h4>Pokladňa – doručenie<\/h4><ul><li>${L===2?'Kompaktný banner s „Pridať“ a ×.':'Checkbox pod GymBeam Boxom.'}<\/li><\/ul>`,\n 'app.instant':`<h4>Instant checkout<\/h4><ul><li>Krátky bottom sheet: produkt, obnovenie, platba, súhlas.<\/li><\/ul>`,\n 'app.terms':`<h4>Obchodné podmienky<\/h4><ul><li>Web view rovnakej CMS stránky.<\/li><\/ul>`\n};\n\n/* ---------- RENDER ---------- */\nfunction toolbar(){\n  return `<div class=\"tb-brand\">GymBeam+ návrh<span>${VNAME}<\/span><\/div>\n  <div class=\"seg\">${[['web','Web desktop'],['mweb','Web mobile'],['app','App']].map(p=>`<button class=\"${S.platform===p[0]?'on':''}\" data-a=\"plat\" data-v=\"${p[0]}\">${p[1]}<\/button>`).join('')}<\/div>\n  <div class=\"pills\">${SCREENS[key()].map(s=>`<button class=\"${cur()===s[0]?'on':''}\" data-a=\"scr\" data-v=\"${s[0]}\">${s[1]}<\/button>`).join('')}<\/div>\n  <div class=\"tb-state\"><label for=\"st\">Stav zákazníka<\/label><select id=\"st\">${Object.entries(STATUS).map(([v,l])=>`<option value=\"${v}\" ${S.status===v?'selected':''}>${l}<\/option>`).join('')}<\/select><button class=\"tb-reset\" data-a=\"reset\">Reset<\/button><\/div>`;\n}\nfunction stage(){\n  const k=key(), sc=cur(); let inner='', ov='';\n  if(k==='web'){\n    if(sc==='plus'||sc==='instant') inner=webHeader()+accLayout(plusWeb())+webFoot();\n    if(sc==='instant') ov=instantWeb();\n    if(sc==='checkout') inner=checkoutWeb();\n    if(sc==='terms') inner=webHeader()+termsBody()+webFoot();\n    if(S.cancelOpen) ov=cancelModal(false);\n    inner=`<div class=\"web\">${inner}<\/div>`;\n  } else {\n    inner={menu:appMenu,plus:appPlus,instant:appPlus,checkout:appCheckout,terms:appTerms}[sc]();\n    if(sc==='instant'
